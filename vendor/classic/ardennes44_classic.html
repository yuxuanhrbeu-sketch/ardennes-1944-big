      </div></div>`;
    host.querySelector('.ad-ic').appendChild(achvCanvas(d.icon, 64, !got));
    host.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  /* ---- 战绩卡导出（1080×1350 PNG，含像素勋章） ---- */
  function exportRecordCard(rec) {
    const W = 1080, H = 1350;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    c.fillStyle = '#14181d'; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(216,183,74,0.35)'; c.lineWidth = 3; c.strokeRect(28, 28, W - 56, H - 56);
    const SCEN = { standard: '突出部（标准）', campaign: '阿登全战役' };
    const ROLE = { de: '德军指挥官', us: '美军指挥官', hotseat: '双人热座', watch: '观战' };
    c.fillStyle = '#78808a'; c.font = '20px Consolas, monospace';
    c.fillText('ARDENNES 1944 · AFTER ACTION', 64, 96);
    c.fillStyle = '#e8e4d8'; c.font = 'bold 54px Bahnschrift, "Microsoft YaHei", sans-serif';
    c.fillText(rec.winner === 'DE' ? '德军获胜' : rec.winner === 'US' ? '美军获胜' : '未分胜负', 64, 168);
    c.fillStyle = '#c8a94a'; c.font = '26px Consolas, monospace';
    c.fillText(`${SCEN[rec.scen] || rec.scen}${rec.noLimit ? ' · 歼灭模式' : ''} · ${ROLE[rec.role] || rec.role}`, 64, 210);
    const rows = [
      ['历时回合', rec.rounds + ' 回合'],
      ['德军战损', rec.loss && rec.loss.DE != null ? Math.round(rec.loss.DE * 100) + '%' : '—'],
      ['美军战损', rec.loss && rec.loss.US != null ? Math.round(rec.loss.US * 100) + '%' : '—'],
      ['渡河装甲', (rec.exits || 0) + ' 个'],
      ['被歼战力', Math.round(((rec.killed && rec.killed.DE) || 0) + ((rec.killed && rec.killed.US) || 0)).toLocaleString('en-US')],
      ['随机种子', rec.seed != null ? String(rec.seed) : '—'],
    ];
    let y = 300;
    c.font = '32px Consolas, monospace';
    for (const [k, v] of rows) {
      c.fillStyle = '#8f968f'; c.fillText(k, 64, y);
      c.fillStyle = '#e8e4d8'; c.fillText(v, 380, y);
      c.strokeStyle = 'rgba(255,255,255,0.09)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(64, y + 22); c.lineTo(W - 64, y + 22); c.stroke();
      y += 66;
    }
    // 本局解锁的像素勋章（最多 12 枚，4 列）
    const ids = (rec.achv || []).filter(id => achvDef(id)).slice(0, 12);
    c.fillStyle = '#c8a94a'; c.font = '24px Consolas, monospace';
    c.fillText(`本局解锁 ${ids.length} 项`, 64, y + 26);
    let ax = 64, ay = y + 60;
    for (let i = 0; i < ids.length; i++) {
      const d = achvDef(ids[i]);
      const m = Achv.pixel(d.icon, false);
      const px = 96 / 16;
      for (let r = 0; r < 16; r++) for (let cc = 0; cc < 16; cc++) {
        const col = m[r][cc]; if (!col) continue;
        c.fillStyle = col;
        c.fillRect(ax + cc * px, ay + r * px, Math.ceil(px), Math.ceil(px));
      }
      c.fillStyle = '#ddd8c8'; c.font = '18px "Microsoft YaHei", sans-serif';
      c.fillText(d.name, ax, ay + 128);
      ax += 240;
      if ((i + 1) % 4 === 0) { ax = 64; ay += 168; }
    }
    c.fillStyle = '#6f766f'; c.font = '20px Consolas, monospace';
    const d0 = new Date(rec.t);
    const p = n => String(n).padStart(2, '0');
    c.fillText(`${d0.getFullYear()}-${p(d0.getMonth() + 1)}-${p(d0.getDate())} ${p(d0.getHours())}:${p(d0.getMinutes())} · 阿登 1944 兵棋推演`, 64, H - 72);
    try {
      const a = document.createElement('a');
      a.download = `ardennes44_战绩卡_${d0.getFullYear()}${p(d0.getMonth() + 1)}${p(d0.getDate())}_${p(d0.getHours())}${p(d0.getMinutes())}.png`;
      a.href = cv.toDataURL('image/png');
      a.click();
      showBanner('战绩卡已导出', 'PNG 1080×1350 · 已存到下载目录', 2200);
    } catch (e) { showBanner('导出失败', '浏览器拒绝保存（' + e.message + '）', 2400); }
  }

  /* ---------------- 初始化 ---------------- */
  function init(rendererRef) {
    renderer = rendererRef;
    renderer.onHexClick = onHexClick;
    renderer.onHexHover = onHexHover;
    $('btnEnd').onclick = () => { if (!aiBusy && game && !game.state.over) { exitAdvance(); game.endPhase(); } };
    $('btnOOB').onclick = showUnitsModal;
    $('btnAchv').onclick = () => { SFX.play('click'); showAchvModal('wall'); };
    // —— 25b 撤子/暂停/AI 指挥/开关浮层 ——
    const _bu = document.getElementById('btnUndo');
    if (_bu) _bu.onclick = () => { SFX.play('click'); doUndo(); };
    const _bp = document.getElementById('btnPause');
    if (_bp) _bp.onclick = togglePause;
    const _bai = document.getElementById('btnAI');
    if (_bai) _bai.onclick = () => { SFX.play('click'); showAIModal(); };
    const _bt = document.getElementById('btnToggles');
    if (_bt) _bt.onclick = (e) => { e.stopPropagation(); SFX.play('click'); toggleSwitchesPop(_bt); };
    $('btnRules').onclick = showRulesModal;
    $('btnRestart').onclick = () => { SFX.play('click'); showStartModal(!!localStorage.getItem('ardennes44_save')); };
    $('btnLogToggle').onclick = () => { SFX.play('click'); toggleLogPanel(); };
    // 音效开关（2026-10 第二十二轮）：状态写入 localStorage，关闭时按钮变暗且文字改为「音效 关」
    // 25b: 音效/档案弹卡合并进「⚙ 开关」浮层（见 toggleSwitchesPop）

    renderAiSpeedBtn();
    renderSfxBtn();
    /* ---- 窄屏菜单（第二十九轮）：顶栏按钮收入 #topBtns 下拉，由 ☰ 开合 ---- */
    {
      const bar = $('topbar'), menu = $('btnMenu'), box = $('topBtns');
      const close = () => bar.classList.remove('open');
      if (menu && box) {
        menu.onclick = e => { e.stopPropagation(); SFX.play('click'); bar.classList.toggle('open'); };
        box.addEventListener('click', e => { if (e.target.tagName === 'BUTTON') close(); });
        renderer.renderer.domElement.addEventListener('pointerdown', close);
        window.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
      }
      // 相机控制条：触屏没有滚轮，＋/－/全图 三个按钮是缩放功能的兜底入口
      const ctl = [['btnZoomIn', 0.82], ['btnZoomOut', 1.22]];
      for (const [id, f] of ctl) { const b = $(id); if (b) b.onclick = () => { SFX.play('click'); renderer.zoomBy(f); }; }
      if ($('btnFit')) $('btnFit').onclick = () => { SFX.play('click'); renderer.fitView(); };
    }
    // 快捷键 L：折叠 / 展开战报（相机平移用 w/a/s/d，互不冲突）
    window.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleLogPanel(); }
    });
    renderLogToggle();
    refreshHint();
  }

  /* ---------------- 音效（2026-10 第二十二轮） ----------------
   * SFX 是纯表现层（见 js/audio.js 头部注释）：不读游戏状态、不消耗 game.rng。
   * 这里只做"游戏事件 → 音效名"的映射；全部调用都容错（SFX 内部 try/catch，未 init 时是空操作）。
   */
  function renderSfxBtn() {
    const b = $('btnSfx');
    if (!b) return;
    const m = SFX.isMuted();
    b.textContent = m ? '音效 关' : '音效 开';
    b.classList.toggle('off', m);
    b.setAttribute('aria-pressed', m ? 'false' : 'true');
  }
  function sfxMoveKind(u) {
    if (!u) return 'foot';
    if (DATA.TYPES[u.type].armor) return 'armor';
    if (u.type === 'ART') return 'arty';
    if (u.type === 'RECON') return 'recon';
    return 'foot';
  }
  // 交火音色：按参战兵种选（纯装甲/混合/纯步兵），空袭与远程炮击各有专属音
  function sfxCombat(d) {
    if (d.air) { SFX.play('air'); return; }
    if (d.ranged && !(d.attUnits && d.attUnits.length)) { SFX.play('arty'); return; }
    const atts = d.attUnits || [];
    const hasArmor = atts.some(u => DATA.TYPES[u.type].armor);
    const hasFoot = atts.some(u => !DATA.TYPES[u.type].armor);
    SFX.play('attack', { kind: hasArmor && hasFoot ? 'mixed' : hasArmor ? 'tank' : 'small' });
    if (d.artyUnits && d.artyUnits.length) SFX.play('arty');   // 支援炮兵：远处炮声叠加
  }
  // 战报文案 → 音效（占领城镇/夺油库/冲出马斯河/断补）
  function sfxLog(e) {
    const t = (e && e.text) || '';
    if (t.indexOf('占领') >= 0) SFX.play('capture');
    else if (t.indexOf('夺取') >= 0) SFX.play('capture');
    else if (t.indexOf('冲出马斯河') >= 0) SFX.play('exit');
    else if (t.indexOf('断补') >= 0) SFX.play('unsupply');
  }

  function hasSave() {
    try { return !!localStorage.getItem('ardennes44_save'); } catch (e) { return false; }
  }

  return { init, showStartModal, hasSave };
})();

</script>
<script>
'use strict';
/* ============================================================
 * intro.js — 开场动画（第二十四轮）
 * 打开程序 → 开局选择界面出现之前，自动播放一段约 6.8 秒的
 * 二维 canvas 动画，视觉贴合第二十轮确立的制图风格（深板岩底、
 * 发丝线六角坐标网、黄铜强调、等宽注记、直角钢印）。
 *
 * 三幕：
 *   ① 六角坐标网自中心逐环淡入 + 一次自上而下的黄铜扫描线；
 *   ② 1944-12-16 德军三路进攻箭头（第6装甲集团军/第5装甲集团军/
 *      第7集团军）自东向西推进，浮现圣维特/巴斯托涅/列日三个地名；
 *   ③ 地图压暗，主标题「阿登 1944」+ kicker + 钢印淡入，整体淡出。
 *
 * 纯表现层铁律：不引用 three/UI/引擎对象、不读对局状态、不消耗
 * 引擎随机数流（粒子微差用模块内局部 LCG）。点击/任意键可跳过；
 * prefers-reduced-motion 时直接不播。动画结束若三维引擎尚未就绪，
 * 留一行等宽提示（不阻塞 boot）。
 * ============================================================ */
(function () {
  const DUR = 6800;                       // 总时长 ms（用户要求 5-10 秒）
  const BG = '#0b0e12';                   // 与页面底色一致
  const INK = '#e8e4d8';                  // 主文字（与顶栏一致）
  const BRASS = '#c8a94a';                // 黄铜强调（--brass）
  const HAIR = 'rgba(255,255,255,0.055)'; // 发丝线（近 --hair）
  const MONO = 'Consolas, "Cascadia Mono", monospace';
  const DISP = 'Bahnschrift, "DIN Alternate", "Arial Narrow", "Microsoft YaHei", sans-serif';

  // —— 模块内局部可复现随机（仅粒子微差，与引擎随机流无关）——
  let seed = 20241216;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

  // —— 三路进攻箭头（归一化坐标，东→西；史实：12/16 三集团军一线展开）——
  const ARROWS = [
    { name: '第6装甲集团军', pts: [[0.885, 0.170], [0.715, 0.235], [0.535, 0.205], [0.345, 0.138]], t0: 1400 },
    { name: '第5装甲集团军', pts: [[0.905, 0.520], [0.720, 0.548], [0.585, 0.545], [0.470, 0.562], [0.360, 0.498]], t0: 1400 },
    { name: '第7集团军',   pts: [[0.875, 0.795], [0.715, 0.845], [0.590, 0.825], [0.520, 0.900]], t0: 2000 }
  ];
  const ARROW_DUR = 2200;
  const TOWNS = [
    { name: '列 日',  xy: [0.315, 0.122], t0: 3600 },
    { name: '圣维特', xy: [0.578, 0.592], t0: 3900 },
    { name: '巴斯托涅', xy: [0.452, 0.622], t0: 4200 }
  ];

  // —— 工具 ——
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  // 二次缓入缓出：起步比三次曲线快（三次曲线前 20% 几乎不动，箭头会"隐形"）
  const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const fade = (t, a, b) => clamp01((t - a) / (b - a));

  // —— 状态 ——
  let canvas = null, ctx = null, raf = 0, t0 = 0, finished = false, flushed = false;
  let W = 0, H = 0, dpr = 1;
  let hexes = [], snow = [], arrowPix = [], townPix = [];
  const queue = [];

  // —— 几何预计算（窗口尺寸变化时重建）——
  function rebuild() {
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 六角坐标网（pointy-top，与棋盘同向）：只存屏幕附近的格心与环序
    hexes = [];
    const R = 26, hw = Math.sqrt(3) * R, hh = 1.5 * R, cx = W / 2, cy = H / 2;
    const N = Math.ceil(Math.max(W, H) / hw) + 4;
    for (let q = -N; q <= N; q++) {
      for (let r = -N; r <= N; r++) {
        const x = cx + hw * (q + r / 2), y = cy + hh * r;
        if (x < -hw || x > W + hw || y < -hh || y > H + hh) continue;
        hexes.push({ x, y, ring: (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2 });
      }
    }
    // 雪（首帧位置随机铺满，缓慢下落）
    if (!snow.length) {
      for (let i = 0; i < 70; i++) snow.push({
        x: rnd() * W, y: rnd() * H, r: 0.7 + rnd() * 1.1,
        vy: 14 + rnd() * 22, ph: rnd() * Math.PI * 2, a: 0.20 + rnd() * 0.25
      });
    }
    // 箭头/地名像素坐标
    arrowPix = ARROWS.map(a => ({ name: a.name, t0: a.t0, pts: a.pts.map(p => ({ x: p[0] * W, y: p[1] * H })) }));
    townPix = TOWNS.map(t => ({ name: t.name, x: t.xy[0] * W, y: t.xy[1] * H, t0: t.t0 }));
  }

  function hexPath(x, y, R) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i + 30);
      const px = x + R * Math.cos(a), py = y + R * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // 军用地图式渐细箭头：沿折线按进度采样，宽度尾粗头细，尖端三角随行
  function drawArrow(a, t) {
    const prog = easeInOut(fade(t, a.t0, a.t0 + ARROW_DUR));
    if (prog <= 0) return;
    const pts = a.pts;
    const segs = [];
    let L = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      segs.push(d); L += d;
    }
    let target = prog * L;
    if (target < 3) return;
    const samples = [];
    let consumed = 0; // 已画出的绝对长度（从尾 0 → 头 L），宽度渐变据此取值
    for (let i = 0; i < segs.length && target > 0; i++) {
      const A = pts[i], B = pts[i + 1];
      const step = Math.min(segs[i], target);
      const n = Math.max(1, Math.ceil(step / 6));
      for (let k = 1; k <= n; k++) {
        const d = segs[i] * k / n;
        if (d > step) break;
        samples.push({ x: A.x + (B.x - A.x) * d / segs[i], y: A.y + (B.y - A.y) * d / segs[i], d: consumed + d });
      }
      consumed += step;
      target -= step;
    }
    if (samples.length < 2) return;
    const done = prog >= 1;
    const headLen = 17, headW = 8.5;
    const left = [], right = [];
    for (let i = 0; i < samples.length; i++) {
      const p = samples[i];
      const q = samples[Math.min(i + 1, samples.length - 1)], o = samples[Math.max(i - 1, 0)];
      let dx = q.x - o.x, dy = q.y - o.y;
      const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
      const fr = p.d / L;
      const w = (i === samples.length - 1 && !done) ? 2.2 : (6.2 - 4.0 * fr);
      left.push({ x: p.x - dy * w, y: p.y + dx * w });
      right.push({ x: p.x + dy * w, y: p.y - dx * w });
    }
    const tip = samples[samples.length - 1];
    const prv = samples[samples.length - 2];
    let dx = tip.x - prv.x, dy = tip.y - prv.y;
    const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const hl = headLen * clamp01((samples.length * 6) / 46); // 起步时小尖
    // 箭身
    ctx.beginPath();
    ctx.moveTo(left[0].x, left[0].y);
    for (const p of left) ctx.lineTo(p.x, p.y);
    for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
    ctx.closePath();
    ctx.fillStyle = 'rgba(200,169,74,0.82)';
    ctx.fill();
    // 尖
    ctx.beginPath();
    ctx.moveTo(tip.x + dx * hl, tip.y + dy * hl);
    ctx.lineTo(tip.x - dy * headW * (hl / headLen), tip.y + dx * headW * (hl / headLen));
    ctx.lineTo(tip.x + dy * headW * (hl / headLen), tip.y - dx * headW * (hl / headLen));
    ctx.closePath();
    ctx.fill();
    // 尾端竖线（地图箭头起笔）
    const s0 = samples[0];
    let tx = -dy, ty = dx;
    ctx.strokeStyle = 'rgba(200,169,74,0.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(s0.x - tx * 6, s0.y - ty * 6);
    ctx.lineTo(s0.x + tx * 6, s0.y + ty * 6);
    ctx.stroke();
    // 番号注记（箭头画完后浮现，起点旁）
    const la = fade(t, a.t0 + ARROW_DUR + 100, a.t0 + ARROW_DUR + 500);
    if (la > 0) {
      ctx.globalAlpha = la * 0.62;
      ctx.fillStyle = INK;
      ctx.font = '11px ' + MONO;
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(a.name, s0.x - 14, s0.y + 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawTitle(t) {
    const lineA = easeOut(fade(t, 4600, 5250));
    const titleA = fade(t, 4900, 5800);
    const stampA = fade(t, 5250, 5950);
    if (titleA <= 0 && lineA <= 0) return;
    const cx = W / 2, cy = H * 0.44;
    // 压暗后的地图之上：kicker / 主标题 / 黄铜线 / 钢印
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (lineA > 0) {
      ctx.globalAlpha = lineA * 0.55;
      ctx.fillStyle = INK;
      try { ctx.letterSpacing = '4px'; } catch (e) { /* 旧引擎忽略 */ }
      ctx.font = '11px ' + MONO;
      ctx.fillText('HEX WARGAME · DEC 1944 — JAN 1945', cx, cy - 54);
      try { ctx.letterSpacing = '0px'; } catch (e) { /* 同上 */ }
    }
    if (titleA > 0) {
      ctx.globalAlpha = titleA;
      ctx.fillStyle = INK;
      ctx.font = '600 52px ' + DISP;
      ctx.fillText('阿登 1944', cx, cy + 4 + (1 - titleA) * 8);
    }
    // 黄铜横线自中心向两侧展开
    const lw = 340 * lineA;
    if (lw > 1) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = BRASS;
      ctx.fillRect(cx - lw / 2, cy + 40, lw, 1.5);
    }
    if (stampA > 0) {
      ctx.globalAlpha = stampA * 0.8;
      ctx.strokeStyle = 'rgba(200,169,74,0.65)';
      ctx.lineWidth = 1;
      const bw = 218, bh = 26;
      ctx.strokeRect(cx - bw / 2, cy + 58, bw, bh);
      ctx.fillStyle = 'rgba(200,169,74,0.9)';
      ctx.font = '12px ' + MONO;
      try { ctx.letterSpacing = '2px'; } catch (e) { /* 忽略 */ }
      ctx.fillText('ARDENNES / 16 DEC 1944', cx, cy + 58 + bh / 2 + 1);
      try { ctx.letterSpacing = '0px'; } catch (e) { /* 忽略 */ }
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const t = now - t0;
    if (finished) return;
    // 背景
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    // ① 六角坐标网：自中心逐环淡入
    for (const h of hexes) {
      const a = fade(t, 150 + h.ring * 42, 640 + h.ring * 42);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      hexPath(h.x, h.y, 25.2);
      ctx.strokeStyle = HAIR;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // ① 自上而下的一次黄铜扫描（极淡，像图纸受光）
    const sw = fade(t, 500, 1500);
    if (sw > 0 && sw < 1) {
      const y = sw * H;
      const g = ctx.createLinearGradient(0, y - 90, 0, y + 90);
      g.addColorStop(0, 'rgba(200,169,74,0)');
      g.addColorStop(0.5, 'rgba(200,169,74,0.07)');
      g.addColorStop(1, 'rgba(200,169,74,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, y - 90, W, 180);
    }
    // 雪（贯穿全程）
    const snowA = fade(t, 700, 1600);
    if (snowA > 0) {
      for (const f of snow) {
        f.y += f.vy / 60; f.x += Math.sin((t / 1400) + f.ph) * 0.18;
        if (f.y > H + 4) { f.y = -4; f.x = rnd() * W; }
        ctx.globalAlpha = f.a * snowA;
        ctx.fillStyle = '#dfe6ee';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // ② 三路进攻箭头 + 番号
    for (const a of arrowPix) drawArrow(a, t);
    // ② 地名点
    for (const tp of townPix) {
      const a = fade(t, tp.t0, tp.t0 + 420);
      if (a <= 0) continue;
      ctx.globalAlpha = a;
      ctx.strokeStyle = 'rgba(200,169,74,0.85)';
      ctx.lineWidth = 1;
      ctx.strokeRect(tp.x - 2.5, tp.y - 2.5, 5, 5);
      ctx.fillStyle = 'rgba(232,228,216,0.72)';
      ctx.font = '11px ' + MONO;
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(tp.name, tp.x + 9, tp.y);
      ctx.globalAlpha = 1;
    }
    // ③ 地图压暗（为标题让光）
    const dim = fade(t, 4700, 5500) * 0.52;
    if (dim > 0) { ctx.fillStyle = 'rgba(11,14,18,' + dim + ')'; ctx.fillRect(0, 0, W, H); }
    drawTitle(t);
    // 跳过提示
    ctx.globalAlpha = 0.38;
    ctx.fillStyle = INK;
    ctx.font = '11px ' + MONO;
    ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('点击任意处跳过 ›', W - 18, H - 16);
    ctx.globalAlpha = 1;
    // 结束：整体淡出
    if (t >= DUR) { finish(false); return; }
    const out = fade(t, 6200, DUR);
    if (out > 0) { ctx.fillStyle = 'rgba(11,14,18,' + out + ')'; ctx.fillRect(0, 0, W, H); }
    raf = requestAnimationFrame(frame);
  }

  function showWait() {
    if (document.getElementById('introWait')) return;
    const d = document.createElement('div');
    d.id = 'introWait';
    d.style.cssText = 'position:fixed;left:0;right:0;bottom:26px;text-align:center;z-index:55;' +
      'font:12px ' + MONO + ';color:rgba(232,228,216,0.62);letter-spacing:1px;pointer-events:none';
    d.textContent = '正在加载三维引擎（three.js 经 CDN 加载，需联网）…… 若长时间停留，请检查网络后刷新';
    document.body.appendChild(d);
  }

  function finish(skipped) {
    if (finished) return;
    finished = true;
    if (raf) cancelAnimationFrame(raf);
    const end = () => {
      try { canvas.remove(); } catch (e) { /* 已移除 */ }
      if (!window.THREE) showWait();
      flushed = true;
      const fns = queue.splice(0);
      for (const fn of fns) { try { fn(); } catch (e) { /* 回调异常不阻断 */ } }
    };
    if (skipped) {
      canvas.style.transition = 'opacity .25s linear';
      canvas.style.opacity = '0';
      setTimeout(end, 270);
    } else end();
  }

  // —— 对外 API（main.js 门控用）——
  globalThis.INTRO = {
    DUR,
    whenDone(fn) { if (flushed) { try { fn(); } catch (e) { /* 忽略 */ } } else queue.push(fn); },
    isPlaying() { return !finished; },
    skip() { finish(true); },
    clearWait() { const d = document.getElementById('introWait'); if (d) d.remove(); },
    // 测试钩子：把时间轴平移到指定时刻（无头核验定格用，不影响正常播放）
    _seek(ms) { if (!finished && canvas) t0 = performance.now() - ms; }
  };

  // —— 启动 ——
  function start() {
    // 用户系统要求减少动态效果 → 不播
    try { if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) { finished = true; flushed = true; return; } } catch (e) { /* 忽略 */ }
    canvas = document.createElement('canvas');
    canvas.setAttribute('aria-hidden', 'true');
    canvas.style.cssText = 'position:fixed;inset:0;z-index:60;background:' + BG;
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');
    rebuild();
    const skip = () => finish(true);
    canvas.addEventListener('click', skip);
    canvas.addEventListener('touchstart', skip, { passive: true });
    window.addEventListener('keydown', skip, { once: false });
    window.addEventListener('resize', rebuild);
    t0 = performance.now();
    raf = requestAnimationFrame(frame);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else start();
})();

</script>
  <script>
'use strict';
/* ============================================================
 * main.js — 启动装配
 * 第三十五轮：3D 引擎改三级回退（内联 → importmap → 备用 CDN），并且**失败要看得见**——
 * 旧版一旦 CDN 拿不到 three，页面只剩顶栏与提示条：没有画布、没有开局界面、也没有报错，
 * 玩家只会说"卡在加载页"。现在用 #bootStatus 显示进度/原因，并提供「重试」。
 * ============================================================ */
(function () {
  const $ = id => document.getElementById(id);
  let booted = false;

  // 启动状态条：msg 为空则隐藏；isError=true 显示为失败态（露出重试按钮）
  function bootStatus(msg, isError, hint) {
    const el = $('bootStatus');
    if (!el) return;
    if (!msg) { el.hidden = true; el.classList.remove('error'); return; }
    el.hidden = false;
    el.classList.toggle('error', !!isError);
    const m = $('bsMsg'), h = $('bsHint');
    if (m) m.innerHTML = (isError ? '' : '<span class="spinner"></span>') + msg;
    if (h) h.textContent = hint || '';
  }
  window.bootStatus = bootStatus;

  function boot() {
    if (booted) return;
    booted = true;
    bootStatus('正在生成战场…');
    const container = document.getElementById('scene');
    let renderer;
    try {
      renderer = new Renderer3D(container);
    } catch (e) {
      // WebGL 不可用 / 上下文创建失败：明确告知，而不是白屏
      bootStatus('3D 画布初始化失败', true,
        (e && e.message ? e.message + ' · ' : '') + '请确认浏览器支持 WebGL（可试试刷新、或换 Chrome/Edge 打开）');
      console.error('[boot] Renderer3D 初始化失败', e);
      return;
    }
    window.__renderer = renderer; // 调试/测试用
    UI.init(renderer);
    bootStatus('');
    // 开场动画（第二十四轮）：播放完毕（或被跳过）后再亮出开局界面
    if (window.INTRO) INTRO.whenDone(() => { INTRO.clearWait(); UI.showStartModal(UI.hasSave()); });
    else UI.showStartModal(UI.hasSave());
  }
  window.__boot = boot;

  function failed() {
    bootStatus('3D 引擎加载失败', true,
      (window.__threeFailed ? window.__threeFailed + ' · ' : '') +
      '这是联网加载 three.js 失败（常见于网络受限/代理环境）。可直接重试；若反复失败，请使用已内联引擎的离线版 dist/ardennes44.html。');
  }

  if (document.readyState === 'complete') {
    if (window.THREE) boot(); else window.addEventListener('three-ready', boot, { once: true });
  } else {
    window.addEventListener('load', () => {
      if (window.THREE) boot();
      else window.addEventListener('three-ready', boot, { once: true });
    });
  }
  window.addEventListener('three-failed', failed);
  // 引擎迟迟不来也要有反馈：超过 4 秒就把状态条摆出来（正常情况下内联版 < 1 秒）
  setTimeout(() => {
    if (!booted && !window.THREE) {
      bootStatus('正在加载 3D 引擎…', false,
        '首次打开需要下载 three.js（约 670KB）；若长时间无响应，多半是网络无法访问 CDN。');
    }
  }, 4000);
  document.addEventListener('DOMContentLoaded', () => {
    const r = $('bsRetry'), l = $('bsReload');
    if (r) r.onclick = () => { bootStatus('正在重试…'); location.reload(); };
    if (l) l.onclick = () => location.reload();
  });
})();

</script>
