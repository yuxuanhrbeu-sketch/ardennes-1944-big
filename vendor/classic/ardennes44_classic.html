    }

    // Dijkstra 可达域(尊重ZOC停止规则)
    getReach(u) {
      const mp = this.movEff(u);
      const start = Hex.key(u.c, u.r);
      const dist = new Map([[start, 0]]);
      const prev = new Map();
      const open = [{ k: start, c: 0 }];
      while (open.length) {
        open.sort((a, b) => a.c - b.c);
        const cur = open.shift();
        if (cur.c > dist.get(cur.k)) continue;
        const p = Hex.parse(cur.k);
        // 非装甲**进入**敌 ZOC 后须停止（"该步之后不能再走"）。
        // 关键：起点本身若已在敌 ZOC（贴着敌人），**不**受此限——否则前线非装甲单位会被
        // 永久钉死（可达域为空 ⇒ 无法移动、无法脱离接触），实测这正是"贴着敌人就动不了"的根源。
        // findPath 一直有这个 `cur.k !== start` 守卫，此处在第三十三轮补齐（同类口径不一致）。
        if (cur.k !== start && this.inZOC(p.c, p.r, u.side) && !DATA.TYPES[u.type].armor) continue;
        for (const n of Hex.neighbors(p.c, p.r)) {
          if (!this.map.hexes.has(Hex.key(n.c, n.r))) continue;
          const sc = this.stepCost(u, p.c, p.r, n.c, n.r);
          if (!isFinite(sc)) continue;
          const nc = cur.c + sc;
          if (nc > mp) continue;
          const nk = Hex.key(n.c, n.r);
          if (!dist.has(nk) || nc < dist.get(nk)) {
            dist.set(nk, nc); prev.set(nk, cur.k);
            open.push({ k: nk, c: nc });
          }
        }
      }
      dist.delete(start);
      // 占用格只能"借道"不能停留 → 从可达域里剔除。
      // 注意 prev 保留完整链，所以 pathFromReach 仍能给出"穿过友军格"的路径；
      // dist 是 UI 高亮与落点校验的依据，剔除后玩家点不到友军格。
      for (const k of [...dist.keys()]) {
        const p = Hex.parse(k);
        if (this.unitAt(p.c, p.r)) dist.delete(k);
      }
      return { dist, prev };
    }

    pathFromReach(reach, destKey) {
      if (!reach.dist.has(destKey)) return null;
      const path = [];
      let k = destKey;
      while (k && reach.prev.has(k)) { path.unshift(Hex.parse(k)); k = reach.prev.get(k); }
      return path;
    }

    // A* 全图路径(供AI长途机动; 执行时会被MP/规则安全截断)
    // opts.avoidZOC: 非装甲避免进入敌ZOC; 友军占用格以高代价绕行(可穿过不停留)
    findPath(u, destC, destR, opts) {
      const avoidZOC = opts && opts.avoidZOC;
      const start = Hex.key(u.c, u.r), goal = Hex.key(destC, destR);
      const gScore = new Map([[start, 0]]);
      const prev = new Map();
      const open = [{ k: start, f: Hex.distance(u.c, u.r, destC, destR) }];
      const closed = new Set();
      const FRIEND_PENALTY = 6;
      while (open.length) {
        open.sort((a, b) => a.f - b.f);
        const cur = open.shift();
        if (closed.has(cur.k)) continue;
        closed.add(cur.k);
        if (cur.k === goal) {
          const path = [];
          let k = goal;
          while (k && k !== start) { path.unshift(Hex.parse(k)); k = prev.get(k); }
          return path;
        }
        const p = Hex.parse(cur.k);
        if (this.inZOC(p.c, p.r, u.side) && !DATA.TYPES[u.type].armor && cur.k !== start) continue;
        for (const n of Hex.neighbors(p.c, p.r)) {
          const nk = Hex.key(n.c, n.r);
          if (!this.map.hexes.has(nk) || closed.has(nk)) continue;
          const occ = this.unitAt(n.c, n.r);
          if (occ && occ.side !== u.side) continue;         // 敌占格不可通过
          const from = Hex.parse(cur.k);
          let sc = this._terrainStep(u, from.c, from.r, n.c, n.r);
          if (!isFinite(sc)) continue;
          if (occ) sc += FRIEND_PENALTY;                    // 友军占格: 拥堵代价
          // 敌ZOC格: 可进入(引擎将在进入时停止), 路径规划中加代价
          if (this.inZOC(n.c, n.r, u.side) && !DATA.TYPES[u.type].armor) sc += (avoidZOC ? 3 : 1);
          const g = gScore.get(cur.k) + sc;
          if (!gScore.has(nk) || g < gScore.get(nk)) {
            gScore.set(nk, g); prev.set(nk, cur.k);
            open.push({ k: nk, f: g + Hex.distance(n.c, n.r, destC, destR) });
          }
        }
      }
      return null;
    }

    // 地形步消耗(不含占用判定)
    _terrainStep(u, fromC, fromR, toC, toR) {
      const from = this.hexAt(fromC, fromR), to = this.hexAt(toC, toR);
      if (!to) return Infinity;
      let cost = DATA.TERRAIN[to.terrain].mv;
      if (from.road && to.road) cost = DATA.ROAD_COST;
      if (to.river && !from.river && !to.bridge) cost += DATA.RIVER_EXTRA;
      return cost;
    }

    _setPos(u, c, r) {
      const ok = Hex.key(u.c, u.r);
      if (this.grid.get(ok) === u) this.grid.delete(ok);
      u.c = c; u.r = r;
      this.grid.set(Hex.key(c, r), u);
    }

    doMove(u, path) {
      if (!u.alive || u.exited || u.side !== this.state.phase || u.moved) return { steps: 0 };
      this._clearPendingAdvance();
      let mp = this.movEff(u);
      const isArmor = DATA.TYPES[u.type].armor;
      // cursor = 结算下一步地形消耗用的"上一格"（含借道格）；lastStay = 最后一个可停留的格（真正的落点）
      let cursor = { c: u.c, r: u.r };
      let lastStay = { c: u.c, r: u.r };
      const walked = [];
      for (const step of path) {
        const occ = this.unitAt(step.c, step.r);
        if (occ && occ !== u && occ.side !== u.side) break;            // 敌占格：不可进入（须攻击）
        const sc = this._terrainStep(u, cursor.c, cursor.r, step.c, step.r);
        if (!isFinite(sc) || sc > mp) break;
        if (occ) {                                                     // 友军占格：只借道，不停留
          // 进敌 ZOC 必须停 → 这里停不下（不能站在友军格上），所以干脆不借这一步
          if (this.inZOC(step.c, step.r, u.side) && !isArmor) break;
          mp -= sc; walked.push(step); cursor = step;
          continue;
        }
        mp -= sc; walked.push(step); cursor = step; lastStay = step;
        if (this.inZOC(step.c, step.r, u.side) && !isArmor) break;      // ZOC停止
      }
      // 借道步不能当作终点：把结尾处那些"停在友军格上"的步切掉
      while (walked.length && !(walked[walked.length - 1].c === lastStay.c && walked[walked.length - 1].r === lastStay.r)) walked.pop();
      if (!walked.length) return { steps: 0 };
      const fromHex = this.hexAt(u.c, u.r);
      this._setPos(u, lastStay.c, lastStay.r);
      u.moved = true;
      const toHex = this.hexAt(lastStay.c, lastStay.r);
      const last = lastStay;
      // 城镇控制
      if (toHex.town && toHex.town.ctrl !== u.side) {
        toHex.town.ctrl = u.side;
        const t = this.map.towns.find(t => t.c === last.c && t.r === last.r);
        if (t) t.ctrl = u.side;
        this.log(`${u.side === 'DE' ? '德军' : '美军'}${u.name} 占领 ${toHex.town.name}`, u.side === 'DE' ? 'de' : 'us');
      }
      // 油库
      if (u.side === 'DE') {
        for (const d of this.map.depots) {
          if (!d.captured && d.c === last.c && d.r === last.r) {
            d.captured = true;
            this.state.fuelDE += d.fuel;
            this.log(`德军夺取${d.name}！燃料 +${d.fuel}`, 'de');
          }
        }
      }
      // 德军渡河(到达马斯河一线)突破 —— 歼灭模式下关闭(否则突围部队永远无法被"歼灭")
      let exited = false;
      if (!this.noTurnLimit && u.side === 'DE' && toHex.exit && (u.type === 'ARM' || u.type === 'MOT')) {
        u.exited = true; u.alive = false;
        this.grid.delete(Hex.key(u.c, u.r));
        this.state.exits++;
        exited = true;
        this.log(`★ ${u.name} 冲出马斯河防线！(累计 ${this.state.exits})`, 'de');
      }
      this.emit('move', { unit: u, path: walked, fromHex, toHex, exited });
      this.emit('state');
      return { steps: walked.length, exited };
    }

    /* ---------------- 攻击 ---------------- */
    // 某守方的可选攻击方(不含炮兵)
    attackersFor(defUnit) {
      const side = this.state.phase;
      if (defUnit.side === side) return [];
      const out = [];
      for (const n of Hex.neighbors(defUnit.c, defUnit.r)) {
        const u = this.unitAt(n.c, n.r);
        if (u && u.side === side && u.alive && !u.attacked && u.type !== 'ART' && u.org > 0) out.push(u);
      }
      return out;
    }

    // 射程内可支援的炮兵
    artyInRange(defUnit) {
      const side = this.state.phase;
      const out = [];
      for (const u of this.units) {
        if (!u.alive || u.side !== side || u.type !== 'ART' || u.fired || u.moved) continue;
        let rng = u.range;
        if (this.state.weather === 'fog') rng -= 1;
        if (this.inZOC(u.c, u.r, side)) continue; // 被贴脸的炮兵不能开火
        if (Hex.distance(u.c, u.r, defUnit.c, defUnit.r) <= rng) out.push(u);
      }
      return out;
    }

    previewAttack(attUnits, defUnit, artyUnits) {
      return Combat.preview(this, attUnits, defUnit, artyUnits || []);
    }

    doAttack(attUnits, defUnit, artyUnits) {
      this._clearPendingAdvance();
      if (!defUnit.alive) return null;
      const side = this.state.phase;
      if (defUnit.side === side) return null;
      attUnits = attUnits.filter(u => u.alive && u.side === side && !u.attacked && !u.exited &&
        Hex.distance(u.c, u.r, defUnit.c, defUnit.r) === 1 && u.type !== 'ART' && u.org > 0);
      if (!attUnits.length) return null;
      if (artyUnits) {
        artyUnits = artyUnits.filter(a => a.alive && a.side === side && a.type === 'ART' && !a.fired && !a.moved &&
          Hex.distance(a.c, a.r, defUnit.c, defUnit.r) <= a.range - (this.state.weather === 'fog' ? 1 : 0));
      } else artyUnits = [];
      // 攻击正面限制: 与预览一致的择优截取
      const capped = Combat.capAttack(attUnits, artyUnits);
      attUnits = capped.atts; artyUnits = capped.arty;
      // 攻击**不消耗机动**（规则：每单位每阶段"可移动一次、攻击一次"，两件事互相独立）。
      // 旧写法在这里把 u.moved 也置真 → 单位一开火面板就显示"已移动"、蓝格也没了，
      // 玩家看到的就是"算子还没移动就显示已经移动完成"（第三十三轮修正）。
      for (const u of attUnits) u.attacked = true;
      for (const a of artyUnits) a.fired = true;
      const res = Combat.resolve(this, attUnits, defUnit, artyUnits);
      // 清阵亡
      for (const d of res.deadUnits) {
        this.grid.delete(Hex.key(d.c, d.r));
        d.alive = false;
        this.noteKill(d);
        this.log(`${d.side === 'DE' ? '德军' : '美军'}${d.name} 被歼灭`, d.side === 'DE' ? 'us' : 'de');
      }
      // 炮火急袭: 参战单位使用后消耗
      for (const a of attUnits) if (a.fireSupport > 0) a.fireSupport = 0;
      // 反坦克小组: 守方遭纯装甲攻击时开火并消耗(战力比已在预览中降档)
      if (attUnits.length && attUnits.every(u => u.type === 'ARM') && defUnit.attach && defUnit.attach.at) {
        defUnit.attach.at = false;
        this.log(`${this._buffName('at', defUnit.side)} 开火！火箭命中，战力比已降一档`, defUnit.side === 'DE' ? 'de' : 'us');
      }
      // 撤退后城镇不再易手(控制以占领为准)
      const rtxt = { AE: '攻方被击溃', AR: '攻方败退', EX: '互有损伤', DR: '守方败退', DE: '守方被击破' };
      const lossTxt = `｜战损(组织度)：攻方 −${Math.round(res.atkDmg || 0)}${res.atkDead ? `（歼灭 ${res.atkDead} 个建制）` : ''}` +
        `，守方 −${Math.round(res.defDmg || 0)}${res.defDead ? `（歼灭 ${res.defDead} 个建制）` : ''}`;
      // 战报点名**攻守双方**（第三十三轮）：旧格式只写"德军进攻 9团"——只出现守方缩写，
      // 玩家在盘上找"到底是谁打的我"极易看错算子（配合当时的画面滞后，就变成了"隔着几格打我"的误报）。
      const attNames = attUnits.map(u => u.abbr || u.name).join('/');
      this.log(`${attUnits[0].side === 'DE' ? '德军' : '美军'}${attNames} 进攻 ${defUnit.abbr || defUnit.name} @${this._coordName(defUnit.c, defUnit.r)}：` +
        `掷出 ${res.d1}+${res.d2}=${res.roll} → ${res.result}(${rtxt[res.result] || ''})${lossTxt}`, attUnits[0].side === 'DE' ? 'de' : 'us');
      // 被动状态(2026-10): 结算时说明攻防为何偏离纸面(不消耗令牌)
      if (res.preview && res.preview.passives) {
        for (const p of res.preview.passives) {
          if (p.name === '无心再战') {
            this.log(`⚠ ${p.side === 'DE' ? '德军' : '美军'}${p.unit} 被围且军心已散（无心再战：攻防×${p.mult}）`, 'warn');
          } else if (p.name === '困兽犹斗') {
            this.log(`${p.side === 'DE' ? '德军' : '美军'}${p.unit} 被围死地，困兽犹斗（攻防×${p.mult}）`, p.side === 'DE' ? 'de' : 'us');
          }
        }
      }
      if (res.advanceOffer) this.state.pendingAdvance = res.advanceOffer;
      // 装甲目标遭无反装甲火力攻击: 说明伤害为何远低于结果表
      if (res.preview && res.preview.softArmor) {
        this.log(`⚠ 攻击方无反装甲火力 vs 装甲目标：守方受损大幅减免（×${DATA.SOFT_VS_ARMOR_DMG}，下限 ${DATA.SOFT_VS_ARMOR_MIN}），可逐退难歼灭`, 'warn');
      }
      this.emit('combat', { defUnit, attUnits, artyUnits, res });
      this.emit('state');
      return res;
    }

    doAdvance(unit) {
      const pa = this.state.pendingAdvance;
      if (!pa || !unit || !pa.units.includes(unit) || !unit.alive) return false;
      if (this.unitAt(pa.hex.c, pa.hex.r)) { this._clearPendingAdvance(); return false; }
      const from = { c: unit.c, r: unit.r };
      this._setPos(unit, pa.hex.c, pa.hex.r);
      const hex = this.hexAt(pa.hex.c, pa.hex.r);
      if (hex.town && hex.town.ctrl !== unit.side) {
        hex.town.ctrl = unit.side;
        const t = this.map.towns.find(t => t.c === hex.c && t.r === hex.r);
        if (t) t.ctrl = unit.side;
        this.log(`${unit.side === 'DE' ? '德军' : '美军'}${unit.name} 占领 ${hex.town.name}`, unit.side === 'DE' ? 'de' : 'us');
      }
      this.state.pendingAdvance = null;
      this.emit('move', { unit, path: [pa.hex], fromHex: this.hexAt(from.c, from.r), toHex: hex, advance: true });
      this.emit('state');
      return true;
    }
    _clearPendingAdvance() { this.state.pendingAdvance = null; }

    // 炮兵远程射击(独立攻击)
    artyFire(artyUnit, targetUnit) {
      if (!artyUnit.alive || artyUnit.type !== 'ART' || artyUnit.fired || artyUnit.moved) return null;
      if (this.inZOC(artyUnit.c, artyUnit.r, artyUnit.side)) return null;
      let rng = artyUnit.range - (this.state.weather === 'fog' ? 1 : 0);
      if (Hex.distance(artyUnit.c, artyUnit.r, targetUnit.c, targetUnit.r) > rng) return null;
      artyUnit.fired = true;
      // 远程火力: 用CRT但只结算守方伤害
      const d1 = 1 + Math.floor(this.rng() * 6), d2 = 1 + Math.floor(this.rng() * 6);
      const roll = d1 + d2;
      const pv = Combat.preview(this, [], targetUnit, [artyUnit]);
      let result = '—';
      if (pv.key) result = DATA.CRT[pv.key][roll - 2];
      const dm = DATA.DMG[result] || { def: 0 };
      const out = { d1, d2, roll, result, events: [], deadUnits: [], retreats: [] };
      if (dm.def > 0) {
        this.dmgOrg(targetUnit, dm.def, 'other');
        this._cas(targetUnit.side, dm.def);
        if (targetUnit.org <= 0) {
          targetUnit.alive = false; this.grid.delete(Hex.key(targetUnit.c, targetUnit.r));
          this.noteKill(targetUnit);
          out.deadUnits.push(targetUnit);
          this.log(`${targetUnit.side === 'DE' ? '德军' : '美军'}${targetUnit.name} 被炮火歼灭`, targetUnit.side === 'DE' ? 'us' : 'de');
        } else if (result === 'DR' || result === 'DE') {
          const to = Combat.retreatHex(this, targetUnit, null, []);
          if (to) { out.retreats.push({ unit: targetUnit, to }); this._setPos(targetUnit, to.c, to.r); }
        }
      }
      this.log(`炮兵(${artyUnit.abbr}) 轰击 ${targetUnit.abbr || targetUnit.name} @${this._coordName(targetUnit.c, targetUnit.r)}：${roll} → ${result}`, artyUnit.side === 'DE' ? 'de' : 'us');
      this.emit('combat', { defUnit: targetUnit, attUnits: [], artyUnits: [artyUnit], res: out, ranged: true });
      this.emit('state');
      return out;
    }

    // 空袭(美军=战斗轰炸机; 德军=对地攻击机, 2026-10 用户需求 + 史实底板行动)
    // side: 'US' | 'DE'; 令牌分别存于 state.airUS / state.airDE。德军不校验天气(令牌只在晴天发放,
    // 底板行动令牌更是不受天气限制——史实当日德军强行出击)。配属防空火力的目标可随机压制本次空袭。
    airStrike(targetUnit, side) {
      side = side || 'US';
      const field = side === 'US' ? 'airUS' : 'airDE';
      if (this.state[field] <= 0) return null;
      if (side === 'US' && this.state.weather !== 'clear') return null;
      if (!targetUnit.alive || targetUnit.side === side) return null;
      // 须在任意本方单位10格内
      let near = false;
      for (const u of this.units) {
        if (u.alive && u.side === side && Hex.distance(u.c, u.r, targetUnit.c, targetUnit.r) <= 10) { near = true; break; }
      }
      if (!near) return null;
      this.state[field]--;
      const hex = this.hexAt(targetUnit.c, targetUnit.r);
      const blocked = ['forest', 'mountain', 'marsh'].includes(hex.terrain);
      const atk = DATA.AIR_ATK[side][blocked ? 'cover' : 'clear'];
      const d1 = 1 + Math.floor(this.rng() * 6), d2 = 1 + Math.floor(this.rng() * 6);
      const roll = d1 + d2;
      // 直接以固定攻击力对防御(含地形; 断补惩罚按第九轮详细设定: 宽限期不受影响)
      const def = Math.max(0.5, targetUnit.def * (targetUnit.org / targetUnit.maxOrg) * DATA.TERRAIN[hex.terrain].dm *
        Combat.supplyMod(targetUnit));
      const pv = Combat.preview(this, [{ atk, org: 10, maxOrg: 10, supplied: true, c: targetUnit.c, r: targetUnit.r, type: 'ARM' }], targetUnit, []);
      let result = '—';
      if (pv.key) result = DATA.CRT[pv.key][roll - 2];
      const dm = DATA.DMG[result] || { def: 0 };
      const out = { d1, d2, roll, result, air: true, side, events: [], deadUnits: [], retreats: [] };
      // 防空火力: 随机压制本次空袭(史实: 高炮火网是德军飞行员的最大杀手)
      let dmg = dm.def > 0 ? dm.def : 0;
      if (dmg > 0 && targetUnit.attach && targetUnit.attach.aa) {
        if (this.rng() < DATA.AA_REDUCE_CHANCE) {
          dmg = Math.max(1, Math.round(dmg * DATA.AA_REDUCE_MULT));
          out.aaFired = true;
          this.log(`${targetUnit.name} 的防空火力锁定来袭机群，空袭效果被压制！（伤害减半）`, targetUnit.side === 'DE' ? 'de' : 'us');
        }
      }
      if (dmg > 0) {
        this.dmgOrg(targetUnit, dmg, 'other');
        this._cas(targetUnit.side, dmg);
        if (targetUnit.org <= 0) {
          targetUnit.alive = false; this.grid.delete(Hex.key(targetUnit.c, targetUnit.r));
          this.noteKill(targetUnit);
          out.deadUnits.push(targetUnit);
          this.log(`${targetUnit.name} 在空袭中被摧毁！`, side === 'US' ? 'us' : 'de');
        } else if (result === 'DR' || result === 'DE') {
          const to = Combat.retreatHex(this, targetUnit, null, []);
          if (to) { out.retreats.push({ unit: targetUnit, to }); this._setPos(targetUnit, to.c, to.r); }
        }
      }
      this.log(`P-47战斗轰炸机 空袭 ${targetUnit.abbr || targetUnit.name} @${this._coordName(targetUnit.c, targetUnit.r)}：${roll} → ${result}`, 'us');
      this.emit('combat', { defUnit: targetUnit, attUnits: [], artyUnits: [], res: out, ranged: true, air: true });
      this.emit('state');
      return out;
    }

    _coordName(c, r) {
      const h = this.hexAt(c, r);
      if (h && h.town) return h.town.name;
      return `(${c},${r})`;
    }

    /* ---------------- 支援资产(增益令牌) ---------------- */
    _freshTokens(side) {
      const t = {};
      for (const k in DATA.BUFFS) t[k] = DATA.BUFFS[k].per;
      return t;
    }
    _buffName(id, side) {
      const b = DATA.BUFFS[id];
      return id === 'at' ? (side === 'US' ? b.usName : b.deName) : b.name;
    }

    // 工兵营自带筑垒能力(2026-10 用户需求): 构筑野战工事时不需要本方令牌, 每单位限一次
    _engrFort(u) {
      return !!(DATA.ENGR_FORT_FREE && u && u.type === 'ENGR');
    }

    // 校验能否为单位赋予增益, 返回 {ok, why}
    canGrant(id, u) {
      const B = DATA.BUFFS[id];
      if (!B) return { ok: false, why: '未知增益' };
      if (!u || !u.alive || u.exited) return { ok: false, why: '单位不存在' };
      if (u.side !== this.state.phase) return { ok: false, why: '仅限当前阶段一方' };
      const free = this._engrFort(u) && id === 'fort';
      if (this.state.tokens[u.side][id] <= 0 && !free) return { ok: false, why: `${this._buffName(id, u.side)}本回合已用完` };
      const inf = ['INF', 'VGD', 'FJ', 'ABN'];
      if (id === 'at') {
        if (!inf.includes(u.type)) return { ok: false, why: '反坦克小组只能配属步兵类单位' };
        if (u.attach.at) return { ok: false, why: '该单位已配属反坦克小组' };
      } else if (id === 'med') {
        if (u.org >= u.maxOrg) return { ok: false, why: '该单位无需救护' };
      } else if (id === 'fire') {
        if (u.fireSupport > 0) return { ok: false, why: '该单位已有炮火急袭' };
      } else if (id === 'repl') {
        if (u.org < u.maxOrg) return { ok: false, why: '补充兵员只能配属满编单位' };
        if (u.attach.repl) return { ok: false, why: '该单位已接受过补充兵员' };
      } else if (id === 'fort') {
        if (u.attach.fort) return { ok: false, why: this._engrFort(u) ? '该工兵已构筑过工事' : '该单位已有野战工事' };
      } else if (id === 'aa') {
        if (u.attach.aa) return { ok: false, why: '该单位已配属防空火力' };
      }
      return { ok: true, why: '' };
    }

    grantBuff(id, u) {
      const chk = this.canGrant(id, u);
      if (!chk.ok) return chk;
      // 工兵自带筑垒不扣本方令牌
      const free = this._engrFort(u) && id === 'fort';
      if (!free) this.state.tokens[u.side][id]--;
      if (id === 'at') u.attach.at = true;
      else if (id === 'med') u.org = Math.min(u.maxOrg, u.org + 4);
      else if (id === 'fire') u.fireSupport = 4;
      else if (id === 'repl') { u.attach.repl = true; u.maxOrg += 2; u.org += 2; }
      else if (id === 'fort') u.attach.fort = true;
      else if (id === 'aa') u.attach.aa = true;
      const nm = this._buffName(id, u.side);
      if (free) this.log(`工兵 ${u.name} 就地构筑野战工事（自带能力，防御×1.25，永久）`, u.side === 'DE' ? 'de' : 'us');
      else this.log(`${nm} 配属 ${u.name}${id === 'med' ? '(组织度+4)' : id === 'repl' ? '(组织上限+2)' : ''}`, u.side === 'DE' ? 'de' : 'us');
      this.emit('buff', { unit: u, id });
      this.emit('state');
      return { ok: true, why: '' };
    }

    /* ---------------- 补给 ---------------- */
    _supply(side) {
      const reach = new Set();
      const sources = [];
      for (const u of this.units) {
        if (u.alive && !u.exited && u.side === side && u.isHQ) sources.push({ c: u.c, r: u.r, radius: DATA.SUPPLY_R_HQ });
      }
      for (const t of this.map.towns) {
        if (t.supply && t.ctrl === side) sources.push({ c: t.c, r: t.r, radius: DATA.SUPPLY_R_TOWN });
      }
      const enemy = this.enemyOf(side);
      for (const s of sources) {
        // BFS 限制半径, 不进敌占格
        const q = [{ c: s.c, r: s.r, d: 0 }];
        const seen = new Set([Hex.key(s.c, s.r)]);
        reach.add(Hex.key(s.c, s.r));
        while (q.length) {
          const cur = q.shift();
          if (cur.d >= s.radius) continue;
          for (const n of Hex.neighbors(cur.c, cur.r)) {
            const k = Hex.key(n.c, n.r);
            if (seen.has(k) || !this.map.hexes.has(k)) continue;
            const occ = this.unitAt(n.c, n.r);
            if (occ && occ.side === enemy) continue;
            seen.add(k); reach.add(k);
            q.push({ c: n.c, r: n.r, d: cur.d + 1 });
          }
        }
      }
      for (const u of this.units) {
        if (u.side === side && u.alive && !u.exited) {
          const now = reach.has(Hex.key(u.c, u.r));
          // 仅在状态变化时报告断补
          if (!now && u.supplied && !DATA.TYPES[u.type].abn) {
            this.log(`${u.side === 'DE' ? '德军' : '美军'}${u.name} 补给被切断！（宽限 ${DATA.UNSUP_GRACE} 回合）`, 'warn');
          }
          u.supplied = now;
        }
      }
      return reach;
    }

    /* ---------------- 回合流程 ---------------- */
    _startPhase() {
      const side = this.state.phase;
      // 刷新本方支援令牌; 上一阶段未使用的炮火急袭失效
      this.state.tokens[side] = this._freshTokens(side);
      for (const u of this.units) if (u.side === side) u.fireSupport = 0;
      this._supply(side);
      // 断补计数(第九轮): 断补在己方阶段开始时 +1 回合, 恢复补给即清零。
      // 宽限期(前 UNSUP_GRACE 回合)内无任何惩罚; 组织度损耗/移动力减半/攻防修正都按它计。
      for (const u of this.units) {
        if (!u.alive || u.exited || u.side !== side) continue;
        if (!u.supplied && !DATA.TYPES[u.type].abn) {
          const was = u.unsupRounds || 0;
          u.unsupRounds = was + 1;
          if (was === DATA.UNSUP_GRACE) {
            this.log(`${u.side === 'DE' ? '德军' : '美军'}${u.name} 断补超过宽限期，攻防开始受损`, 'warn');
          }
        } else {
          u.unsupRounds = 0;
        }
      }
      // 整补
      for (const u of this.units) {
        if (!u.alive || u.exited || u.side !== side) continue;
        const t = DATA.TYPES[u.type];
        if (u.supplied) {
          const hex = this.hexAt(u.c, u.r);
          const inTown = hex.town && hex.town.ctrl === side;
          u.org = Math.min(u.maxOrg, u.org + (inTown ? 3 : 2));
        } else if (!t.abn && u.unsupRounds > DATA.UNSUP_GRACE) {
          // 断补组织度损耗: 宽限期(前两回合)不损耗, 第 3 回合起每阶段 -1(现行设定生效时点后移)
          this.dmgOrg(u, 1, 'other');
          this._cas(side, 1);
          if (u.org <= 0) {
            u.alive = false; this.grid.delete(Hex.key(u.c, u.r));
            this.noteKill(u);
            this.log(`${side === 'DE' ? '德军' : '美军'}${u.name} 因断补与疲惫而溃散`, 'warn');
            this.emit('elim', u);
          }
        }
        u.moved = false; u.attacked = false; u.fired = false;
      }
      // 增援
      // 注意（第三十三轮）：`_supply` 必须放在**整批增援落位之后**再跑一次。
      // 旧写法是"每加一支就重算一次"，于是同回合抵达的部队会被瞬时的补给网误判——
      // 典型是第80师317团与自己的 III 军司令部同回合入场：317 团先落位时军部还没进场，
      // 它被算成断补并打出一条"补给被切断！"的吓人战报，同回合稍后又恢复。
      let arrived = 0;
      for (const row of (side === 'DE' ? DATA.OOB_DE : DATA.OOB_US)) {
        if (row[9] === this.state.round) {
          const u = this._addUnit({ id: row[0], name: row[1], abbr: row[2], type: row[3], atk: row[4], def: row[5], mov: row[6], c: row[7], r: row[8], side, arrive: row[9], org: row[10] });
          arrived++;
          this.log(`【增援】${side === 'DE' ? '德军' : '美军'}${u.name} 进入战场！`, side === 'DE' ? 'de' : 'us');
          this.emit('reinforce', u);
        }
      }
      if (arrived) this._supply(side);       // 整批落位后再判补给（含本回合入场的 HQ）
      if (side === 'US') {
        this.state.airUS = (this.state.weather === 'clear' && this.state.round >= this.scenario.airFrom) ? 2 : 0;
        if (this.state.airUS > 0) this.log('天气晴好，美军战斗机-轰炸机联队可以出击(2次空袭)', 'us');
      } else {
        // 德军空袭(2026-10): 史实 12/16~12/23 恶劣天气德军航空兵停飞, 12/24 起才有成规模出击;
        // 1945-01-01 底板行动一次性倾巢出动(不受当天天气限制, 史实当日德军强行起飞)
        let n = (this.state.weather === 'clear' && this.state.round >= DATA.DE_AIR_FROM) ? DATA.DE_AIR_PER_CLEAR : 0;
        let boden = false;
        if (this.state.round === DATA.DE_AIR_BODENPLATTE_ROUND) { n += DATA.DE_AIR_BODENPLATTE_TOKENS; boden = true; }
        this.state.airDE = n;
        if (boden) this.log(`◈ 底板行动：德国空军倾巢出动空袭盟军机场(${DATA.DE_AIR_BODENPLATTE_TOKENS}次空袭)——这是它最后的大规模出击`, 'de');
        else if (n > 0) this.log('天气放晴，德国空军对地攻击机队可以出击(1次空袭)', 'de');
      }
      this.emit('phase');
      this.emit('state');
    }

    endPhase() {
      if (this.state.over) return;
      this._clearPendingAdvance();
      const side = this.state.phase;
      // 德军燃料结算
      if (side === 'DE') {
        let burn = 0;
        for (const u of this.units) if (u.alive && u.side === 'DE' && u.moved && u.type === 'ARM') burn++;
        this.state.fuelDE = Math.max(0, this.state.fuelDE - burn);
        if (burn > 0) this.log(`德军装甲集群消耗燃料 ${burn} 点(剩余 ${this.state.fuelDE})`, 'de');
      }
      if (this.noTurnLimit) {
        // 歼灭模式(第二十三轮): 每阶段结束都查一次——任一方全部建制(含未入场援军)归零即终局
        this._checkAnnihilation();
        if (this.state.over) { this.emit('over'); this.emit('state'); return; }
      }
      if (side === 'DE') {
        this.state.phase = 'US';
        this.log(`── 第${this.state.round}回合 · 美军阶段 ──`, 'sys');
        this._startPhase();
      } else {
        // 回合结束 → 胜负检查（歼灭模式下由上面的 _checkAnnihilation 负责，无回合上限）
        if (!this.noTurnLimit) {
          this._checkVictory();
          if (this.state.over) { this.emit('over'); this.emit('state'); return; }
        }
        this.state.round++;
        this.state.phase = 'DE';
        if (!this.noTurnLimit && this.state.round > this.scenario.rounds) {
          this._finalVerdict();
          this.emit('over'); this.emit('state');
          return;
        }
        this._rollWeather(false);
        this.log(`── 第${this.state.round}回合 · ${this._dateStr()} · 天气:${this._weatherName()} ──`, 'sys');
        this._eventNotes();
        this._startPhase();
      }
      this.emit('state');
      this._save();
    }

    _dateStr() {
      // 史实日历表(见 data.js DATES): 与 EVENTS 史实注记逐条对齐; 越界时退回线性推算
      const iso = DATA.DATES[this.state.round - 1];
      if (iso) { const p = iso.split('-'); return `${+p[0]}年${+p[1]}月${+p[2]}日`; }
      const d = new Date(1944, 11, 15 + this.state.round);
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    _rollWeather(force) {
      const table = this.state.round >= this.scenario.lateWeather ? DATA.WEATHER_PROB.late : DATA.WEATHER_PROB.early;
      const x = this.rng();
      if (x < table.clear) this.state.weather = 'clear';
      else if (x < table.clear + table.fog) this.state.weather = 'fog';
      else this.state.weather = 'snow';
      this.emit('weather', this.state.weather);
    }

    _eventNotes() {
      const note = DATA.EVENTS[this.state.round];
      if (note) this.log(`◈ 史实注记：${note}`, 'hist');
    }

    /* ---------------- 胜负 ---------------- */
    _holds(name) { const t = this.map.townMap[name]; return t && t.ctrl === 'DE'; }

    /* ---- 歼灭模式（取消回合限制，第二十三轮）---- */
    // 在场存活（含已阵亡不计、渡河退出在本模式下不存在）
    _aliveCount(side) { return this.units.filter(u => u.alive && !u.exited && u.side === side).length; }
    // 尚未入场的援军行数：按 id 判断该 OOB 行是否已经 spawn 过（units 保留阵亡者，故 id 在册即已入场）
    _pendingReinforce(side) {
      const rows = side === 'DE' ? DATA.OOB_DE : DATA.OOB_US;
      let n = 0;
      for (const row of rows) {
        if (row[9] <= 0) continue;                                   // 开局单位，不在"援军"之列
        if (!this.units.some(u => u.side === side && u.id === row[0])) n++;
      }
      return n;
    }
    // 一方"剩余建制" = 在场存活 + 尚未入场的援军；归零即被彻底歼灭
    _remaining(side) { return this._aliveCount(side) + this._pendingReinforce(side); }
    _checkAnnihilation() {
      const st = this.state;
      if (st.over) return;
      const deLeft = this._remaining('DE'), usLeft = this._remaining('US');
      if (deLeft === 0) {
        st.over = true; st.winner = 'US';
        st.endText = '歼灭战胜利！德军在阿登的全部建制——包括最后赶到的援军——已被逐一消灭，突出部再无一兵一卒。';
        st.victoryKey = 'US_annihilation';
        this.log('◆ 德军全部建制被歼灭，战役结束！', 'us');
      } else if (usLeft === 0) {
        st.over = true; st.winner = 'DE';
        st.endText = '歼灭战胜利！美军在阿登的全部建制——包括驰援的各师与独立营——已被逐一消灭，通往马斯河的道路再无阻挡。';
        st.victoryKey = 'DE_annihilation';
        this.log('◆ 美军全部建制被歼灭，战役结束！', 'de');
      }
    }

    _checkVictory() {
      const st = this.state;
      if (st.over) return;
      const holdsBoth = this._holds('圣维特') && this._holds('巴斯托涅');
      if (st.round >= 10 && holdsBoth) {
        st.over = true; st.winner = 'DE';
        st.endText = '德军决定性胜利！圣维特与巴斯托涅双双陷落，美军第12集团军群防线被拦腰斩断。';
        st.victoryKey = 'DE_decisive';
        this.log('◆ 德军夺取两大枢纽，达成决定性突破！', 'de');
        return;
      }
      if (!this.scenario.campaign && st.round > this.scenario.rounds) this._finalVerdict();
    }

    _finalVerdict() {
      const st = this.state;
      const holdsStV = this._holds('圣维特'), holdsBast = this._holds('巴斯托涅'), holdsHouf = this._holds('豪法利兹');
      const usLoss = this._lossPct('US');
      if (!this.scenario.campaign) {
        const obj = (st.exits >= 1 ? 1 : 0) + (holdsStV ? 1 : 0) + (holdsBast ? 1 : 0);
        if (st.exits >= DATA.EXITS_NEEDED) {
          st.over = true; st.winner = 'DE';
          st.endText = `德军决定性胜利！${st.exits}个装甲战斗群冲过马斯河，通往安特卫普的大门洞开。`;
          st.victoryKey = 'DE_decisive';
        } else if (obj >= 2) {
          st.over = true; st.winner = 'DE';
          st.endText = `德军战术胜利。${st.exits > 0 ? '一部抵达马斯河，' : ''}${holdsStV ? '圣维特' : ''}${holdsStV && holdsBast ? '与' : ''}${holdsBast ? '巴斯托涅' : ''}易手，但攻势未能发展成合围。`;
          st.victoryKey = 'DE_tactical';
        } else if (obj === 0 && usLoss < 0.25) {
          st.over = true; st.winner = 'US';
          st.endText = '美军决定性胜利！德军攻势处处受挫，未能夺取任何目标，损失惨重。';
          st.victoryKey = 'US_decisive';
        } else {
          st.over = true; st.winner = 'US';
          st.endText = '美军胜利。突出部被挡住并逐次削平，德军最后的赌注输光了。';
          st.victoryKey = 'US_win';
        }
      } else {
        const usHolds = [holdsStV, holdsBast, holdsHouf].filter(x => !x).length;
        const deHolds = 3 - usHolds;
        const deLoss = this._lossPct('DE');
        if (usHolds === 3 && deLoss >= 0.35) {
          st.over = true; st.winner = 'US';
          st.endText = '美军决定性胜利！三大枢纽全部收复，德军重兵集团遭到重创。';
          st.victoryKey = 'US_decisive';
        } else if (deHolds >= 2) {
          st.over = true; st.winner = 'DE';
          st.endText = '德军胜利。突出部得以保持，盟军反攻未能达成目标。';
          st.victoryKey = 'DE_hold';
        } else {
          st.over = true; st.winner = 'US';
          st.endText = '美军惨胜。突出部最终被削平，但德军主力得以脱身。';
          st.victoryKey = 'US_pyrrhic';
        }
      }
      this.log(`◆ 战役结束 — ${st.winner === 'DE' ? '德军' : '美军'}获胜`, 'sys');
    }

    /* ---------------- 存档 ---------------- */
    _save() {
      try {
        if (typeof localStorage === 'undefined') return;
        const data = this.serialize();
        localStorage.setItem('ardennes44_save', JSON.stringify(data));
      } catch (e) { /* ignore */ }
    }
    serialize() {
      return {
        v: 1, scenarioId: this.scenario.id, rngSeed: this.rngSeed,
        state: JSON.parse(JSON.stringify(this.state, (k, v) => k === 'pendingAdvance' ? undefined : v)),
        towns: this.map.towns.map(t => ({ n: t.name, ctrl: t.ctrl })),
        depots: this.map.depots.map(d => ({ n: d.name, cap: d.captured })),
        log: this.logEntries.slice(-60),
        units: this.units.map(u => ({
          id: u.id, uid: u.uid, c: u.c, r: u.r, org: u.org, maxOrg: u.maxOrg, alive: u.alive, exited: u.exited,
          moved: u.moved, attacked: u.attacked, fired: u.fired, supplied: u.supplied, unsup: u.unsupRounds || 0,
          attach: { at: !!u.attach.at, fort: !!u.attach.fort, repl: !!u.attach.repl, aa: !!u.attach.aa },
        })),
      };
    }
    /* 25b 撤子: 快照/恢复（自大阿登移植；restore 先清容器防算子叠加） */
    snapshotJson() { return JSON.stringify(this.serialize()); }
    restoreJson(json) {
      this.units = [];
      this.grid.clear();
      this._zocDirty();
      this._load(JSON.parse(json));
    }
    _load(s) {
      // 恢复状态
      this.state = Object.assign({}, s.state);
      this.state.pendingAdvance = null;
      // 取消回合限制开关随存档恢复（旧存档无此字段 → false，行为不变）
      if (this.state.noTurnLimit === undefined) this.state.noTurnLimit = false;
      this.noTurnLimit = !!this.state.noTurnLimit;
      for (const t of s.towns) {
        const mt = this.map.townMap[t.n];
        if (mt) { mt.ctrl = t.ctrl; const h = this.hexAt(mt.c, mt.r); if (h && h.town) h.town.ctrl = t.ctrl; }
      }
      for (const d of s.depots) {
        const md = this.map.depots.find(x => x.name === d.n);
        if (md) md.captured = d.cap;
      }
      const byId = {};
      for (const row of DATA.OOB_DE) byId[row[0] + '_DE'] = row;
      for (const row of DATA.OOB_US) byId[row[0] + '_US'] = row;
      this._uid = UID_START;   // 读档：先按 OOB 顺序重建，再用存档里的 uid 覆盖，最后续号
      for (const su of s.units) {
        const key = su.id + (DATA.OOB_DE.find(r => r[0] === su.id) ? '_DE' : '_US');
        const row = byId[key];
        if (!row) continue;
        const u = this._addUnit({ id: row[0], name: row[1], abbr: row[2], type: row[3], atk: row[4], def: row[5], mov: row[6], c: su.c, r: su.r, side: key.endsWith('_DE') ? 'DE' : 'US', arrive: row[9], org: su.org, homeR: row[8] });
        u.uid = su.uid; u.org = su.org; u.alive = su.alive; u.exited = su.exited;
        u.moved = su.moved; u.attacked = su.attacked; u.fired = su.fired; u.supplied = su.supplied;
        u.unsupRounds = su.unsup || 0;   // 旧存档无此字段 → 0(宽限期重新计, 可接受)
        u.maxOrg = su.maxOrg || 10;
        u.attach = su.attach || { at: false, fort: false, repl: false };
        if (!u.alive || u.exited) { this.grid.delete(Hex.key(u.c, u.r)); }
      }
      this._uid = Math.max(this._uid, ...s.units.map(u => u.uid || 0)) + 1;
      this.logEntries = s.log || [];
      this.rng = mulberry32(this.rngSeed);
      // 重掷一遍以推进随机流近似(简单处理: 不重放)
    }
  }

  return Game;
})();

  <script>
'use strict';
/* ============================================================
 * ai.js — 双方启发式 AI
 * 德军: 装甲沿走廊突破(圣维特→乌尔特河→马斯河), 集中优势火力攻坚
 * 美军: 城镇据守、受压迟滞后撤、预备队驰援、晴天空袭; 第二阶段反攻
 * 模式: plan(静态计划) → execute(逐步执行+动态补刀)
 * ============================================================ */
globalThis.AI = (function () {

  const T = DATA.TYPES;

  // 美军要点城镇（守备优先级名单）：任务目标层 usObjective 的唯一依据，
  // 避免名单各写一份而漂移（旧代码在 aiSpendTokens 里还有一份硬编码副本，已删）。
  // 德军侧对应 SIDE_CFG.DE.keyTowns（第二十八轮统一行为层后的对称结构）。
  const US_KEY_TOWNS = ['圣维特', '巴斯托涅', '克莱沃', '维尔茨', '豪法利兹', '斯塔沃洛', '马尔梅迪', '马尔什'];

  function armor(u) { return T[u.type].armor; }

  /* ============================================================
   * 态势 / 被动特性评估（2026-10 第二十一轮新增）
   * ------------------------------------------------------------
   * 被动状态由 Combat.passiveState 统一判定（与战斗结算同一套逻辑 → 预览/结算天然一致）：
   *   协同作战  邻接友军 ≥ PASSIVE.coordMinFriends(2)                → 攻防 ×1.10
   *   困兽犹斗  被围(0 友邻) 且 邻敌 ≥ encMinEnemies(3) 且士气判定过 → 攻防 ×1.15
   *   无心再战  被围但士气判定没过                                  → 攻防 ×0.60
   * AI"主动经营被动"的两个抓手：
   *   ① 机动落点评分含"邻接友军数"（吃到协同）与"落点是否会被围"（0 友邻 + 邻敌≥3 是陷阱）；
   *   ② 选靶时优先打被动对敌方不利的目标（无心再战 ×0.60 / 已过宽限期的断补 → 一推就散）。
   * ⚠️ passiveState 只读棋盘态势、不消耗 game.rng（见 combat.js 的 moraleRoll 注释），
   *    因此可以在规划阶段反复调用而不会改变后续掷骰序列。
   * ============================================================ */
  function passiveOf(game, u) { return Combat.passiveState(game, u); }

  // 单位"假如站在 (c,r)"时的邻接友军 / 敌军数（不改动任何状态）
  function friendsAt(game, u, c, r) {
    let n = 0;
    for (const p of Hex.neighbors(c, r)) {
      const f = game.unitAt(p.c, p.r);
      if (f && f.alive && f !== u && f.side === u.side) n++;
    }
    return n;
  }
  function enemiesAt(game, u, c, r) {
    let n = 0;
    for (const p of Hex.neighbors(c, r)) {
      const f = game.unitAt(p.c, p.r);
      if (f && f.alive && f.side !== u.side) n++;
    }
    return n;
  }

  /* ============================================================
   * 单位价值与期望交换（2026-10 第二十五轮: "用低价值部队歼灭敌人高价值部队"）
   * ------------------------------------------------------------
   * unitValue: 单位"账面价值" —— 战力(atk+def)为基线, 装甲/反装甲/炮兵溢价, 残破线性贬值。
   *   美军步兵团 ≈ 0.8~0.9, 德军装甲营 ≈ 2.0~2.3 —— 用步兵团换掉装甲营就是大赚。
   * attackWorth: 一次攻击的期望交换收益 = 守方期望价值损失 − 攻方期望价值损失 × LOSS_AVERSION。
   *   期望伤害直接查本次 preview 的 CRT 行(11 个骰值等概率), 与结算同一张表 → 评估天然一致。
   *   ⚠️ 引擎口径: resolve 对"传入的攻方名单全体"结算伤害(每个单位全额挨 dm.atk),
   *      而 preview 只按攻击正面(3 地面 + 2 炮兵)计战力 —— 所以组队必须在 ≤3+2 内做,
   *      超编的单位白白挨打。softArmor(无反装甲火力打装甲 → 守方伤害×0.25)在这里自动
   *      压低 worth, "没巴祖卡就别咬坦克"不再需要任何特判。
   * ============================================================ */
  function unitValue(u) {
    const t = T[u.type];
    let v = (u.atk + u.def) / 10;
    if (t.armor) v *= 1.5;
    else if (t.antiArmor) v *= 1.3;
    else if (u.type === 'ART') v *= 1.4;
    return v * (0.3 + 0.7 * u.org / u.maxOrg);
  }

  // CRT 行的期望组织度伤害(每个参战单位全额挨打, 11 个骰值等概率)
  function crtExpect(row) {
    let a = 0, d = 0;
    for (const r of row) { a += DATA.DMG[r].atk; d += DATA.DMG[r].def; }
    return { atk: a / row.length, def: d / row.length };
  }

  const LOSS_AVERSION = 1.15;   // 攻方损失厌恶: 防御方反冲击留 15% 安全边际
  function attackWorth(game, atts, e, arty, pv) {
    if (!pv || !pv.row) return -1;
    const ex = crtExpect(pv.row);
    let atkLoss = 0;
    for (const a of atts) atkLoss += unitValue(a) * Math.min(ex.atk, a.org) / Math.max(a.maxOrg, 1);
    if (arty && arty.length) {
      let pHit = 0;                                    // 炮兵挨打 = min(1, dm.atk−2): 仅 AE(7)/EX(3) 达标
      for (const r of pv.row) if (DATA.DMG[r].atk >= 3) pHit++;
      const p = pHit / pv.row.length;
      for (const a of arty) atkLoss += unitValue(a) * p / Math.max(a.maxOrg, 1);
    }
    let dLoss = Math.min(ex.def, e.org);
    if (pv.softArmor) dLoss = Math.max(DATA.SOFT_VS_ARMOR_MIN, dLoss * DATA.SOFT_VS_ARMOR_DMG);
    return unitValue(e) * dLoss / Math.max(e.maxOrg, 1) - atkLoss * LOSS_AVERSION;
  }

  // 美军攻击组队(第二十五轮): 便宜高效的单位先顶(每点战力的价值成本升序), 再做前缀扫描
  //   挑期望交换最好的规模 —— 1 个够就不带 2 个, 2 个够就不带 3 个(少暴露一个是一个)。
  //   炮兵取射程内战力最高的 2 门(攻击正面上限): 炮兵几乎不挨打, 且参战即消除 softArmor,
  //   是"步兵围猎装甲"的火力基石。opts.excludeFire: 急袭令牌选靶时排除已带 fireSupport 的单位。
  function attackGroup(game, e, planned, opts) {
    let pool = game.attackersFor(e)
      .filter(u => !planned.has(u.uid) && !(opts && opts.excludeFire && u.fireSupport > 0));
    // maxForce（第二十七轮·血战）：不求交换比、求最大拳头 —— 直接上最强 3 地面 + 2 炮兵
    if (opts && opts.maxForce) {
      pool = pool.sort((a, b) => b.atk * (b.org / b.maxOrg) - a.atk * (a.org / a.maxOrg));
    } else {
      pool = pool.sort((a, b) => unitValue(a) / (a.atk * (a.org / a.maxOrg) + 0.1) -
        unitValue(b) / (b.atk * (b.org / b.maxOrg) + 0.1));
    }
    if (!pool.length) return null;
    const arty = game.artyInRange(e).filter(a => !planned.has(a.uid))
      .sort((a, b) => b.sup - a.sup).slice(0, 2);
    if (opts && opts.maxForce) {
      const atts = pool.slice(0, 3);
      const pv = game.previewAttack(atts, e, arty);
      if (!pv.key) return null;
      return { atts, arty, pv, w: attackWorth(game, atts, e, arty, pv) };
    }
    let best = null;
    for (let k = 1; k <= Math.min(3, pool.length); k++) {   // 攻击正面 FRONTAGE=3
      const atts = pool.slice(0, k);
      const pv = game.previewAttack(atts, e, arty);
      if (!pv.key) continue;
      const w = attackWorth(game, atts, e, arty, pv) - k * 0.02;  // 期望同分时倾向少用兵
      if (w > (best ? best.w : -1e9)) best = { atts, arty, pv, w };
    }
    return best;
  }

  // 攻击后的推进人选（第二十五轮）: 美军"便宜单位顶线" —— 推进进德军空格的是最便宜的单位,
  //   装甲营等高价值单位留在原地继续防; 德军维持引擎默认(装甲优先, 扩大突破)。
  function pickAdvancer(side, offer) {
    const alive = offer.units.filter(u => u.alive);
    if (!alive.length) return null;
    if (side === 'US') alive.sort((a, b) => unitValue(a) - unitValue(b));
    return alive[0];
  }

  // 防御阵地评分（美军发扬防御力优势用）：地形加成 + 己控城镇 + 协同 − 被围风险
  function defPositionScore(game, u, c, r) {
    const h = game.hexAt(c, r);
    if (!h) return -99;
    let s = DATA.TERRAIN[h.terrain].dm * 3;
    if (h.town) s += (h.town.tier >= 2 ? 1.8 : 0.9) + (h.town.ctrl === u.side ? 1.0 : 0);
    if (u.attach && u.attach.fort) s += 1.2;                            // 已筑工事: 走了就白丢 ×1.25, 留守加分
    const fr = friendsAt(game, u, c, r), en = enemiesAt(game, u, c, r);
    s += Math.min(fr, DATA.PASSIVE.coordMinFriends) * 0.8;              // 协同：≥2 友邻即满收益
    if (fr === 0 && en >= DATA.PASSIVE.encMinEnemies) s -= 4.0;         // 被围陷阱（可能"无心再战"）
    else if (fr === 0 && en >= 2) s -= 1.0;
    if (en > 3) s -= 0.8 * (en - 3);                                    // 邻敌过多：侧翼全露
    return s;
  }

  // 路径安全截断（第二十一轮；第三十一轮起与引擎口径一致：**友军格可借道、不可停留**）
  //   —— 引擎侧由 getReach 剔除占用格 + doMove 只认"最后可停留格"保证不会同格叠子，
  //      这里再把"落点必须是空格"与"本回合别人已预定的落点"两道闸门补齐。
  let reserved = null;   // 本次 planTurn 内已被预定的落点（Hex.key 集合），planTurn 首尾重置
  function safePath(game, path, side) {
    if (!path || !path.length) return null;
    const out = [];
    for (const p of path) {
      const occ = game.unitAt(p.c, p.r);
      if (occ && occ.side !== side) break;                      // 敌占格：到此为止（须攻击解决）
      if (reserved && reserved.has(Hex.key(p.c, p.r))) break;  // 本回合已被预定：不借道也不停留
      out.push(p);
    }
    while (out.length && game.unitAt(out[out.length - 1].c, out[out.length - 1].r)) out.pop();  // 借道不能当终点
    return out.length ? out : null;
  }

  // 登记一次移动：截断 → 预定落点 → 记录动作。返回是否成功（调用方据此决定 continue）
  function planMove(game, acts, planned, u, path) {
    const p = safePath(game, path, u.side);
    if (!p) return false;
    const last = p[p.length - 1];
    if (reserved) reserved.add(Hex.key(last.c, last.r));
    planned.add(u.uid);
    acts.push({ t: 'move', uid: u.uid, path: p });
    return true;
  }

  /* ============================================================
   * 血战姿态（2026-10 第二十七轮："两军不顾一切互相进攻，即使一方远远处于下风"）
   * ------------------------------------------------------------
   * 背景：歼灭模式（无回合限制）残局曾出现"诡异相持"——美军只剩几个单位龟缩时，
   *   德军走廊目标已全部占领/残敌远离走廊 → 走廊聚焦跳过逻辑让德军永不攻击、
   *   机动又只朝城镇走 → 双方长期原地不动（双方均无计划动作）。本节从机制上消灭相持：
   *   ① berserk：歼灭模式全程血战；standard/campaign 中任一方存活 ≤ BERSERK_LEFT 也触发；
   *   ② convergeOn：向指定敌军收拢（直达 → 可达域严格逼近 → 邻格逼近 三级兜底），
   *      取代旧"nd<=5 才散开"的小半径兜底 —— 够不着就走近，不再出现原地不动的单位；
   *   ③ 血战下攻击不再看走廊聚焦/战力比阈值/softArmor 惩罚：能打就打（引擎下限 1:4）。
   * ============================================================ */
  const BERSERK_LEFT = 8;   // 任一方在场存活 ≤ 8 即进入血战姿态（歼灭模式无条件血战）

  function aliveCount(game, side) {
    let n = 0;
    for (const u of game.units) if (u.alive && !u.exited && u.side === side) n++;
    return n;
  }

  function berserk(game) {
    if (game.state.noTurnLimit) return true;
    return aliveCount(game, 'DE') <= BERSERK_LEFT || aliveCount(game, 'US') <= BERSERK_LEFT;
  }

  function nearestEnemy(game, u, side) {
    let best = null, bd = 1e9;
    for (const e of game.units) {
      if (!e.alive || e.exited || e.side === side) continue;
      const d = Hex.distance(u.c, u.r, e.c, e.r);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }

  /* ---------- 通用位移引擎（第二十八轮重写） ----------
   * ⚠️ 性能教训（实测，务必别改回去）：findPath(A*) 打向"被占用的目标格"会穷搜整张地图，
   *    单次均值 25.6ms —— planTurn 从 110ms 劣化到 1.4s 的全部原因都在这里；
   *    而 getReach（完整 Dijkstra）只要 0.27ms/次，还能直接给出"本回合可达域里离目标
   *    最近的那个格"（单回合推进效果与 A* 等价）。因此位移一律"先可达域、后 A*"，
   *    并且绝不把 A* 打到占用格上（改为打向目标周围的空位）。
   */
  let pathBudget = null;          // 每回合允许的 A* 次数（性能护栏），planTurn 首尾重置
  const PATH_BUDGET = 30;

  function tryPath(game, acts, planned, u, c, r) {
    if (!game.map.hexes.has(Hex.key(c, r))) return false;
    if (game.unitAt(c, r)) return false;                       // 占用目标：不 A*（避免全图穷搜）
    if (pathBudget && pathBudget.n <= 0) return false;
    if (pathBudget) pathBudget.n--;
    return planMove(game, acts, planned, u, game.findPath(u, c, r, { avoidZOC: !armor(u) }));
  }

  // 目标周围的空位（目标格被占 / 需要包抄贴合时使用）：近者优先，同距离看地形
  function slotsAround(game, u, c, r) {
    return Hex.neighbors(c, r)
      .filter(p => game.map.hexes.has(Hex.key(p.c, p.r)) && !game.unitAt(p.c, p.r) &&
        !(reserved && reserved.has(Hex.key(p.c, p.r))))
      .sort((a, b) => Hex.distance(u.c, u.r, a.c, a.r) - Hex.distance(u.c, u.r, b.c, b.r) ||
        defPositionScore(game, u, b.c, b.r) - defPositionScore(game, u, a.c, a.r));
  }

  // 可达域逼近（主力位移手段）：先只接受"严格更近"，没有再退到"不更远但协同/地形更好"
  function reachApproach(game, acts, planned, u, tgt) {
    const reach = game.getReach(u);
    const curD = Hex.distance(u.c, u.r, tgt.c, tgt.r);
    let strictK = null, strictS = 1e9, eqK = null, eqS = -1e9;
    for (const k of reach.dist.keys()) {
      const p = Hex.parse(k);
      if (game.unitAt(p.c, p.r)) continue;                     // 不停在已占用格（§19 坑 1）
      if (reserved && reserved.has(k)) continue;               // 不撞本回合预定落点
      const d = Hex.distance(p.c, p.r, tgt.c, tgt.r);
      if (d > curD) continue;                                  // 不接受变远
      let s = d * 3;
      for (const n of Hex.neighbors(p.c, p.r)) {
        const f = game.unitAt(n.c, n.r);
        if (f && f.side !== u.side) s += f.def + 2;
      }
      const fr = friendsAt(game, u, p.c, p.r), en = enemiesAt(game, u, p.c, p.r);
      s -= Math.min(fr, DATA.PASSIVE.coordMinFriends) * 0.45;                 // 协同：邻接友军
      s -= defPositionScore(game, u, p.c, p.r) * 0.15;                        // 防御地形偏好（美军经验）
      if (fr === 0 && en >= DATA.PASSIVE.encMinEnemies) s += 6;               // 别把自己送进包围圈
      if (d < curD) { if (s < strictS) { strictS = s; strictK = k; } }
      else {
        const es = s * -1 + d * 3;
        if (es > eqS) { eqS = es; eqK = k; }
      }
    }
    const k = strictK || eqK;
    return k ? planMove(game, acts, planned, u, game.pathFromReach(reach, k)) : false;
  }

  // 邻格兜底（最后一道）：严格更近优先；没有则"不更远但协同更好"，保证能动就有动作
  function stepClosest(game, acts, planned, u, tgt) {
    const curD = Hex.distance(u.c, u.r, tgt.c, tgt.r);
    let best = null, bd = 1e9, bestEq = null, bes = -1e9;
    for (const n of Hex.neighbors(u.c, u.r)) {
      const k = Hex.key(n.c, n.r);
      if (!game.map.hexes.has(k) || game.unitAt(n.c, n.r)) continue;
      if (reserved && reserved.has(k)) continue;
      const d = Hex.distance(n.c, n.r, tgt.c, tgt.r);
      if (d < curD) { if (d < bd) { bd = d; best = n; } }
      else if (d === curD) {
        const s = Math.min(friendsAt(game, u, n.c, n.r), DATA.PASSIVE.coordMinFriends) * 1.2 -
          enemiesAt(game, u, n.c, n.r) * 0.5;
        if (s > bes) { bes = s; bestEq = n; }
      }
    }
    const pick = best || bestEq;
    return pick ? planMove(game, acts, planned, u, [pick]) : false;
  }

  // 统一接近流程：可达域逼近 → 目标周围空位 A* → 目标格 A* → 邻格兜底
  function convergeOn(game, acts, planned, u, tgt) {
    if (!tgt) return false;
    if (reachApproach(game, acts, planned, u, tgt)) return true;
    for (const p of slotsAround(game, u, tgt.c, tgt.r).slice(0, 2)) {
      if (tryPath(game, acts, planned, u, p.c, p.r)) return true;
    }
    if (tryPath(game, acts, planned, u, tgt.c, tgt.r)) return true;
    return stepClosest(game, acts, planned, u, tgt);
  }

  /* ============================================================
   * 统一行为层（2026-10 第二十八轮）：两军共用同一套交战流水线
   * ------------------------------------------------------------
   * 德军与美军"怎么打、怎么走、怎么配属"完全一致；唯一差异收敛到下方的任务目标层
   * （SIDE_CFG / objectiveFor）：
   *     DE 目标 = 走廊要点 → 马斯河渡河口（standard/campaign 既定作战目标）
   *     US 目标 = 已失/被围要点优先 → 最近的己方控制要点（campaign R13+ 切反攻枢纽）
   *     berserk = 歼灭模式全程 / 任一方 ≤8 存活 → 目标层失效，双方都扑"最近残敌"
   * 流水线（双方同序、同门槛）：planAir → planAttacks → planManeuver → planArty，
   *   移动后再跑一次同标准的 dynamicAttackPass 补刀。
   * 对峙的结构性排除：planManeuver 第 ③ 步是"无条件接敌兜底"——任何既没排到攻击、
   *   也无法朝任务目标推进的地面单位，只要地图上还有敌人，就必须向它逼近（走进一格
   *   也算）；只有"被地形/合围物理封死"才允许不动。这是本节唯一不可绕过的钉子。
   * ============================================================ */
  const ENGAGE_RADIUS = 6;   // 通用接敌半径：6 格内有敌人 → 先与该敌接触（双方同一标准）
  const ART_FOLLOW_D = 4;    // 炮兵无射击目标时，向最近本方前线单位跟进的距离阈值

  const SIDE_CFG = {
    DE: {
      foe: 'US',
      keyTowns: ['圣维特', '巴斯托涅', '马尔什', '迪南', '纳慕尔', '斯塔沃洛', '马尔梅迪',
        '克莱沃', '维尔茨', '豪法利兹', '埃希特纳赫', '维尔萨姆', '埃滕布罗克', '日韦'],
      target: (game, u) => germanTarget(game, u)
    },
    US: {
      foe: 'DE',
      keyTowns: US_KEY_TOWNS,
      target: (game, u) => usObjective(game, u)
    }
  };

  /* ---------- 通用态势评估（双方同一把尺） ---------- */
  // 威胁值：相邻敌军攻击力之和 —— 缓冲排序 / 工事发放 / 是否受压，全部走这一个入口
  function threatAt(game, u) {
    let th = 0;
    for (const n of Hex.neighbors(u.c, u.r)) {
      const e = game.unitAt(n.c, n.r);
      if (e && e.side !== u.side) th += e.atk * (e.org / e.maxOrg) + 1;
    }
    return th;
  }
  function keyTownsOf(side) { return SIDE_CFG[side] ? SIDE_CFG[side].keyTowns : []; }

  function inKeyTown(game, u) {
    const h = game.hexAt(u.c, u.r);
    const list = keyTownsOf(u.side);
    return !!(h.town && h.town.ctrl === u.side && list.includes(h.town.name));
  }
  function inDefTerrain(game, u) {
    const h = game.hexAt(u.c, u.r);
    return !!(h.town || h.terrain === 'forest' || h.terrain === 'mountain');
  }
  function contact(game, u) { return enemiesAt(game, u, u.c, u.r) > 0; }
  // 已就位的要点守军：它的任务是守住这座要点，不参与外出接敌（标准/全战役下）
  function posted(game, u) { return inKeyTown(game, u); }

  function objectiveFor(game, u) {
    const cfg = SIDE_CFG[u.side];
    return cfg ? cfg.target(game, u) : null;
  }

  /* ---------- 任务目标层（唯一差异） ---------- */
  // 德军走廊目标（第二十轮定稿，原样保留）
  function germanTarget(game, u) {
    const rd = game.state.round;
    const homeR = u.homeR !== undefined ? u.homeR : u.r;
    let names;
    if (rd >= 8) {
      names = ['迪南', '日韦', '纳慕尔', '巴斯托涅', '马尔什'];       // 后期: 直扑马斯河
    } else if (homeR <= 9) {
      names = rd <= 3 ? ['圣维特', '斯塔沃洛', '马尔梅迪'] : ['斯塔沃洛', '马尔梅迪', '维尔萨姆', '圣维特'];
    } else if (homeR <= 17) {
      names = rd <= 3 ? ['圣维特', '克莱沃'] : ['克莱沃', '豪法利兹', '维尔茨', '巴斯托涅'];
    } else {
      names = rd <= 3 ? ['克莱沃', '维尔茨', '埃希特纳赫'] : ['维尔茨', '巴斯托涅', '埃滕布罗克'];
    }
    names = names.filter(n => game.map.townMap[n] && game.map.townMap[n].ctrl !== 'DE');
    if (!names.length) names = ['迪南', '日韦', '纳慕尔'];
    // ⚠️ A/B 实测(2026-10 第二轮): 目标分流做多路并进的三个变体全部否决(西进回退 3~5 列、
    //    要点夺取率下降)。"最近未占目标"是最优解；多路并进的入口是缺口机动。
    let best = null, bestS = 1e9;
    for (const n of names) {
      const t = game.map.townMap[n];
      const d = Hex.distance(u.c, u.r, t.c, t.r);
      if (d < bestS) { bestS = d; best = t; }
    }
    return best;
  }

  // 美军任务目标（第二十八轮：取代旧 usHotspot / planUSOffensive 的目标选择部分）
  function usObjective(game, u) {
    const names = keyTownsOf('US');
    // ① campaign 第二阶段（R13+）：目标是仍被德军占据的反攻枢纽
    if (game.scenario.campaign && game.state.round > 12) {
      let t = null, bd = 1e9;
      for (const n of DATA.US_OFFENSIVE_TARGETS) {
        const x = game.map.townMap[n];
        if (!x || x.ctrl !== 'DE') continue;
        const d = Hex.distance(u.c, u.r, x.c, x.r);
        if (d < bd) { bd = d; t = x; }
      }
      if (t) return t;
    }
    // ② 已失守的要点优先 —— 收复
    for (const n of names) { const t = game.map.townMap[n]; if (t && t.ctrl === 'DE') return t; }
    // ③ 正被围攻的己方要点 —— 紧急驰援
    for (const n of names) {
      const t = game.map.townMap[n];
      if (!t || t.ctrl !== 'US') continue;
      const guard = game.unitAt(t.c, t.r);
      if (guard && guard.side === 'US' && enemiesAt(game, guard, t.c, t.r) >= 2) return t;
    }
    // ④ 最近的己方控制要点 —— 常规守备/迟滞线
    let best = null, bd = 1e9;
    for (const n of names) {
      const t = game.map.townMap[n];
      if (!t || t.ctrl === 'DE') continue;
      const d = Hex.distance(u.c, u.r, t.c, t.r);
      if (d < bd) { bd = d; best = t; }
    }
    if (best) return best;
    // ⑤ 兜底：最近的己方控制城镇
    for (const t of game.map.towns) {
      if (t.ctrl !== 'US') continue;
      const d = Hex.distance(u.c, u.r, t.c, t.r);
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  }

  /* ---------- 机动：接敌目标选择与缺口机动（双方同一套） ---------- */
  // 交战目标选择：近 / 孤立 / 昂贵三者权衡（吸收旧 usHotspot 的"围猎孤立高价值目标"思想，
  //   第二十八轮推广到双方）—— berserk 下退化为"最近残敌"，保证一定有人去咬最后几个建制
  function engageTarget(game, u) {
    let best = null, bs = -1e9;
    for (const e of game.units) {
      if (!e.alive || e.exited || e.side === u.side) continue;
      const d = Hex.distance(u.c, u.r, e.c, e.r);
      if (d > ENGAGE_RADIUS + 4) continue;
      const iso = friendsAt(game, e, e.c, e.r) <= 1 ? 1.3 : 1;
      const s = unitValue(e) * iso / (d + 1);
      if (s > bs) { bs = s; best = e; }
    }
    return best || nearestEnemy(game, u, u.side);
  }

  /* ---------- ① 空袭（双方同一打分：兵种权重 × 打击力 × 地形遮蔽 × 组织比 × 孤立加成） ---------- */
  function planAir(game, side, acts) {
    const left = side === 'DE' ? game.state.airDE : game.state.airUS;
    if (!(left > 0)) return;
    const cands = [];
    for (const e of game.units) {
      if (!e.alive || e.exited || e.side === side) continue;
      const t = game.hexAt(e.c, e.r).terrain;
      const cover = (t === 'forest' || t === 'mountain' || t === 'marsh') ? 0.4 : 1;
      const w = armor(e) ? 3 : e.type === 'ART' ? 2 : 1;
      const iso = friendsAt(game, e, e.c, e.r) <= 1 ? 1.3 : 1;
      cands.push({ u: e, s: w * e.atk * cover * (e.org / e.maxOrg) * iso });
    }
    cands.sort((a, b) => b.s - a.s);
    for (let i = 0; i < Math.min(left, cands.length); i++) acts.push({ t: 'air', target: cands[i].u.uid });
  }

  /* ---------- ② 静态攻击（合并原 planUS 步骤 3 与 germanAttackCandidates） ----------
   * 非血战：有效期望 > -0.05 且 ratio ≥ 1.2 —— 双方同一条线，不再分阵营两套门槛。
   *   有效期望 = 期望交换 + 态势加成（孤立 +0.3 / 无心再战 +0.4 / 被我军围住 +0.2）。
   * 血战：pv.key 存在即出手（引擎下限 1:4），maxForce 组队（最强 3 地面 + 2 炮兵）。
   * 排序：期望守方价值损失优先 + 交换收益 + 目标位于本方任务方向上的加成（双方同一把尺）。
   */
  function planAttacks(game, side, acts, planned, allOut) {
    const cands = [];
    for (const e of game.units) {
      if (!e.alive || e.exited || e.side === side) continue;
      const g = attackGroup(game, e, planned, allOut ? { maxForce: true } : undefined);
      if (!g || !g.pv.key) continue;
      let score, passGate;
      if (allOut) {
        score = crtExpect(g.pv.row).def * unitValue(e) + g.w;
        passGate = true;
      } else {
        const dfr = friendsAt(game, e, e.c, e.r);
        const ps = passiveOf(game, e);
        const sur = enemiesAt(game, e, e.c, e.r);
        const wEff = g.w + (dfr <= 1 ? 0.3 : 0) + (ps.key === 'broken' ? 0.4 : 0) + (sur >= 2 ? 0.2 : 0);
        score = crtExpect(g.pv.row).def * unitValue(e) + g.w * 2;
        passGate = wEff > -0.05 && g.pv.ratio >= 1.2;
      }
      if (!passGate) continue;
      const obj = objectiveFor(game, g.atts[0]);
      const dObj = obj ? Hex.distance(e.c, e.r, obj.c, obj.r) : 99;
      score += dObj <= 3 ? 0.6 : dObj <= 6 ? 0.2 : 0;
      cands.push({ e, g, score });
    }
    cands.sort((a, b) => b.score - a.score);
    for (const c of cands) {
      const atts = c.g.atts.filter(x => !planned.has(x.uid));
      if (!atts.length) continue;
      const arty = c.g.arty.filter(x => !planned.has(x.uid));
      for (const a of atts) planned.add(a.uid);
      for (const a of arty) planned.add(a.uid);
      acts.push({ t: 'attack', uids: atts.map(x => x.uid), target: c.e.uid, arty: arty.map(x => x.uid) });
    }
  }

  /* ---------- ③ 机动（合并原 planGerman 步骤 3 / planUS 步骤 1~2b / planUSBerserk 步骤 ②）
   *   ① 接敌：6 格内有敌人（或血战姿态）且不是已就位的要点守军 → 向最优交战目标收拢；
   *   ② 目标：向本方任务目标推进（被封锁则缺口机动）；
   *   ③ 无条件接敌兜底：只要地图上还有敌人就必须逼近 —— 结构性排除对峙。
   */
  function planManeuver(game, side, acts, planned, allOut) {
    const my = game.units.filter(u => u.alive && !u.exited && u.side === side && u.arrive <= game.state.round);
    const movers = my.filter(u => !planned.has(u.uid) && u.type !== 'ART' && u.type !== 'HQ')
      .sort((a, b) => (armor(b) ? 1 : 0) - (armor(a) ? 1 : 0) || b.mov - a.mov);
    // 性能护栏见 tryPath/reachApproach：A* 每回合限 PATH_BUDGET 次且不打占用格；
    //   getReach（0.27ms/次）是主力位移手段，不再需要额外预算。
    for (const u of movers) {
      if (planned.has(u.uid)) continue;
      const stayPosted = posted(game, u) && !allOut;
      const foe = allOut ? nearestEnemy(game, u, side) : engageTarget(game, u);
      if (foe) {
        const near = allOut || Hex.distance(u.c, u.r, foe.c, foe.r) <= ENGAGE_RADIUS;
        if (near && !stayPosted && convergeOn(game, acts, planned, u, foe)) continue;
      }
      const obj = objectiveFor(game, u);
      if (obj && !(u.c === obj.c && u.r === obj.r)) {
        if (tryPath(game, acts, planned, u, obj.c, obj.r)) continue;      // 目标格本身是空的：直接 A*
        if (convergeOn(game, acts, planned, u, obj)) continue;            // 被占/绕行：可达域逼近 + 周边空位
      }
      // ③ 钉子：以上都没成，只要还有敌人就无条件逼近（走进一格也算）——不留任何"无事可做"的分支
      if (foe && !stayPosted) convergeOn(game, acts, planned, u, foe);
    }
  }

  /* ---------- ④ 炮兵（合并两份：压制"正贴着我方部队"的敌人优先；无目标则向最近本方前线跟进） ---------- */
  function planArty(game, side, acts, planned) {
    const my = game.units.filter(u => u.alive && !u.exited && u.side === side);
    for (const a of my) {
      if (a.type !== 'ART' || planned.has(a.uid)) continue;
      if (game.inZOC(a.c, a.r, side)) continue;                    // 被贴脸不能射击
      const rng = a.range - (game.state.weather === 'fog' ? 1 : 0);
      let best = null, score = -1;
      for (const e of game.units) {
        if (!e.alive || e.exited || e.side === side) continue;
        if (Hex.distance(a.c, a.r, e.c, e.r) > rng) continue;
        const pressing = enemiesAt(game, e, e.c, e.r) >= 2 ? 1.2 : 0;   // 正贴着我方部队打
        const s = (armor(e) ? 3 : 1) + (e.type === 'ART' ? 0.3 : 0) + e.org / 10 + pressing +
          Math.max(0, 1 - e.org / 10) * 1.5;                            // 残破者优先（一击可灭）
        if (s > score) { score = s; best = e; }
      }
      if (best) { planned.add(a.uid); acts.push({ t: 'arty', uid: a.uid, target: best.uid }); continue; }
      let anchor = null, ad = 1e9;
      for (const f of my) {
        if (f.type === 'ART' || f.type === 'HQ' || !f.alive) continue;
        const d = Hex.distance(a.c, a.r, f.c, f.r);
        if (d > ART_FOLLOW_D && d < ad) { ad = d; anchor = f; }
      }
      // 跟进：走通用位移引擎（锚点是友军单位所在格 = 占用格，绝不能直接 A*，见位移引擎注释）
      if (anchor) convergeOn(game, acts, planned, a, anchor);
    }
  }

  /* ---------- 计划流水线（双方唯一入口） ---------- */
  function planSide(game, side, acts, planned) {
    const allOut = berserk(game);
    planAir(game, side, acts);                     // ① 空袭（不占用己方单位的行动）
    planAttacks(game, side, acts, planned, allOut); // ② 静态攻击
    planManeuver(game, side, acts, planned, allOut); // ③ 机动 / 接敌 / 兜底
    planArty(game, side, acts, planned);            // ④ 炮兵（放在最后：此时目标位置已定）
  }

  /* ---------------- 支援资产使用（第二十一轮重写：按阵营分工 + 按需要排序发放） ----------------
   * 令牌每回合就这么多（工事1 / 救护1 / 急袭1 / 补充1 / 反坦克2 / 防空2），所以不能再
   * "按单位表顺序先到先得"——先按"谁最需要"排序，再一个一个发。
   * 阵营分工：
   *   德军（进攻方）—— 工事给已夺要点守军与前线装甲；救护/补充给正在攻坚的部队；
   *                    急袭给"即将进行的那次最值钱的攻击"的攻方；防空给装甲（美军空袭只打德军装甲）。
   *   美军（防御方）—— 工事铺满"防御地形 + 已接敌"的守军（防御 ×1.25 是防御力优势的放大器）；
   *                    反坦克小组优先给面对德军装甲的步兵；防空兼顾炮兵（德军空袭第二目标）；
   *                    救护/补充给被围攻的守军；急袭留给有把握的反击，没有就不浪费。
   */
  /* ---------------- 支援资产使用（2026-10 第二十八轮：统一"按需发放"，双方同一套规则） ----------------
   * 令牌每回合就这么点（工事1 / 救护1 / 急袭1 / 补充1 / 反坦克2 / 防空2），先按"谁最需要"排序再发。
   * 统一排序键 needKey = 守备紧迫度×10 + 已接敌 5 + 相邻敌军威胁值（双方同基准，不再分阵营两套偏好）。
   * 第二十八轮把原先的阵营差异全部取消：进攻方与防御方拿到同样的增益逻辑，
   *   —— 左右行为差异只保留"任务目标层"（SIDE_CFG/objectiveFor），见本节上方说明。
   */
  function aiSpendTokens(game, side) {
    // 护栏: tokens.US 只在美军阶段建立（踩坑 5），旧存档/异常调用时缺字段不能让 AI 崩
    const tk = game.state.tokens[side] || (game.state.tokens[side] = { fort: 0, at: 0, med: 0, fire: 0, repl: 0, aa: 0 });
    const my = () => game.units.filter(u => u.alive && !u.exited && u.side === side);
    // 守备紧迫度（第二十五轮提出，第二十八轮推广到双方）：要点守备 > 被围攻
    const keyUrgency = u => (inKeyTown(game, u) ? 2 : 0) + (enemiesAt(game, u, u.c, u.r) >= 2 ? 1 : 0);
    const needKey = u => keyUrgency(u) * 10 + (contact(game, u) ? 5 : 0) + threatAt(game, u);
    const nearEnemyArmor = (u, rad) => {
      for (const p of Hex.range(u.c, u.r, rad, game.map.cols, game.map.rows)) {
        const e = game.unitAt(p.c, p.r);
        if (e && e.side !== side && T[e.type].armor) return true;
      }
      return false;
    };
    // ① 野战工事（防御 ×1.25）：发给"要点 / 防御地形 / 已接敌"的单位，威胁最高者优先
    const fortCands = my()
      .filter(u => !u.attach.fort && u.type !== 'ART' && u.type !== 'HQ' && u.type !== 'RECON')
      .filter(u => inKeyTown(game, u) || inDefTerrain(game, u) || contact(game, u))
      .sort((a, b) => needKey(b) - needKey(a));
    for (const u of fortCands) {
      if (tk.fort <= 0) break;
      game.grantBuff('fort', u);
    }
    // ② 工兵自带筑垒: 不消耗令牌, 每个工兵营各一次
    for (const u of my()) {
      if (u.type !== 'ENGR' || u.attach.fort) continue;
      game.grantBuff('fort', u);
    }
    // ③ 防空火力（遭空袭 50% 压制、伤害减半）：装甲 / 炮兵 / 要点与接敌部队
    const aaCands = my()
      .filter(u => !u.attach.aa && u.type !== 'HQ')
      .filter(u => armor(u) || u.type === 'ART' || keyUrgency(u) > 0)
      .sort((a, b) => needKey(b) - needKey(a));
    for (const u of aaCands) {
      if (tk.aa <= 0) break;
      game.grantBuff('aa', u);
    }
    // ④ 野战救护所（+4 组织度）：最需要续命者（紧迫度 → 接敌 → 组织度最低）
    if (tk.med > 0) {
      const cands = my()
        .filter(u => u.org < u.maxOrg && u.supplied && u.type !== 'HQ')
        .sort((a, b) => needKey(b) - needKey(a) || a.org - b.org);
      if (cands.length && cands[0].org <= 6) game.grantBuff('med', cands[0]);
    }
    // ⑤ 补充兵员（满编 +2 组织上限）：紧迫度最高的满编单位
    if (tk.repl > 0) {
      const cands = my()
        .filter(u => u.org === u.maxOrg && !u.attach.repl && u.type !== 'HQ')
        .sort((a, b) => needKey(b) - needKey(a) || b.def - a.def);
      if (cands.length) game.grantBuff('repl', cands[0]);
    }
    // ⑥ 反坦克小组（防御 ×1.5 且遭纯装甲攻击再降一档）：给面对敌方装甲的步兵
    let atLeft = 2;
    const atCands = my()
      .filter(u => !u.attach.at && ['INF', 'VGD', 'FJ', 'ABN'].includes(u.type))
      .filter(u => nearEnemyArmor(u, 3) || inKeyTown(game, u) || (inDefTerrain(game, u) && contact(game, u)))
      .sort((a, b) => needKey(b) - needKey(a) || b.def - a.def);
    for (const u of atCands) {
      if (atLeft <= 0 || tk.at <= 0) break;
      if (game.grantBuff('at', u).ok) atLeft--;
    }
    // ⑦ 炮火急袭（该单位下一次攻击 +4）：双方都用同一把"期望交换"尺子挑最划算的那次围歼
    if (tk.fire > 0) {
      let bestPick = null, bestVal = -1e9;
      for (const e of game.units) {
        if (!e.alive || e.exited || e.side === side) continue;
        const g = attackGroup(game, e, new Set(), { excludeFire: true });
        if (!g || !g.pv.key) continue;
        const val = g.w + crtExpect(g.pv.row).def * unitValue(e) +
          (armor(e) ? 0.5 : 0) + (game.hexAt(e.c, e.r).town ? 0.4 : 0);
        if (val > bestVal) { bestVal = val; bestPick = g.atts[0]; }
      }
      if (bestPick && game.grantBuff('fire', bestPick).ok) { /* 已发放 */ }
    }
  }
  /* ---------------- 计划总入口 ---------------- */
  function planTurn(game, side) {
    aiSpendTokens(game, side);
    const acts = [];
    const planned = new Set();
    reserved = new Set();     // 本回合已被预定的落点（防止两份计划撞同一格 → 同格冲突）
    pathBudget = { n: PATH_BUDGET };   // 本回合允许的 A* 次数（性能护栏，见 tryPath）
    try {
      planSide(game, side, acts, planned);   // 第二十八轮：两侧共用同一条流水线
    } finally {
      reserved = null;
      pathBudget = null;
    }
    // 注意: 结束阶段由 executeTurn 收尾负责, 计划中不再包含 end 动作
    return acts;
  }

  /* ---------------- 执行 ---------------- */
  function executeTurn(game, side, schedule, done) {
    const acts = planTurn(game, side);
    let i = 0;
    const delay = 30;
    function next() {
      if (game.state.over) { done(); return; }
      if (i >= acts.length) {
        // 动态补刀: 移动后再评估一轮攻击
        dynamicAttackPass(game, side, schedule, () => { if (!game.state.over) game.endPhase(); done(); });
        return;
      }
      const a = acts[i++];
      execAction(game, side, a);
      schedule(next, delay);
    }
    schedule(next, delay);
  }

  function execAction(game, side, a) {
    if (a.t === 'move') {
      const u = game.units.find(x => x.uid === a.uid);
      if (u && u.alive && u.side === side && !u.moved) game.doMove(u, a.path);
    } else if (a.t === 'attack') {
      const target = game.units.find(x => x.uid === a.target && x.alive);
      if (!target) return;
      const atts = a.uids.map(id => game.units.find(x => x.uid === id))
        .filter(u => u && u.alive && u.side === side && !u.attacked && u.type !== 'ART' &&
          Hex.distance(u.c, u.r, target.c, target.r) === 1);
      if (!atts.length) return;
      const arty = (a.arty || []).map(id => game.units.find(x => x.uid === id))
        .filter(x => x && x.alive && !x.fired && !x.moved && x.type === 'ART');
      const res = game.doAttack(atts, target, arty);
      if (res && res.advanceOffer) {
        const cand = pickAdvancer(side, res.advanceOffer);
        if (cand) game.doAdvance(cand);
      }
    } else if (a.t === 'arty') {
      const u = game.units.find(x => x.uid === a.uid);
      const t = game.units.find(x => x.uid === a.target && x.alive);
      if (u && t && u.alive) game.artyFire(u, t);
    } else if (a.t === 'air') {
      const t = game.units.find(x => x.uid === a.target && x.alive);
      if (t) game.airStrike(t, side);
    } else if (a.t === 'end') {
      game.endPhase();
    }
  }

  function dynamicAttackPass(game, side, schedule, done) {
    const steps = [];
    const built = new Set();
    const allOut = berserk(game);   // 血战姿态下补刀不看任何阈值
    for (const e of game.units.filter(x => x.alive && !x.exited && x.side !== side)) {
      // 第二十八轮：动态补刀与静态攻击完全同标准（同一组队器 + 同一套门槛）。
      //   非血战：有效期望 > -0.05 且 ratio ≥ 1.2（态势加成：孤立+0.3 / 无心再战+0.4 / 被围+0.2）；
      //   血战：maxForce 组队、pv.key 存在即出手。移动后出现的临时战机（贴上孤立的敌人等）
      //   按同一把尺子处理，双方不再有两套补刀逻辑。
      const g = attackGroup(game, e, built, allOut ? { maxForce: true } : undefined);
      if (!g || !g.pv.key) continue;
      if (!allOut) {
        const dfr = friendsAt(game, e, e.c, e.r);
        const surrounded = enemiesAt(game, e, e.c, e.r);
        const ps = Combat.passiveState(game, e);
        const wEff = g.w + (dfr <= 1 ? 0.3 : 0) + (ps.key === 'broken' ? 0.4 : 0) + (surrounded >= 2 ? 0.2 : 0);
        if (wEff <= -0.05 || g.pv.ratio < 1.2) continue;
      }
      for (const u of g.atts) built.add(u.uid);
      for (const u of g.arty) built.add(u.uid);
      steps.push({ atts: g.atts, e, arty: g.arty });
    }
    let i = 0;
    (function step() {
      if (i >= steps.length || game.state.over) { done(); return; }
      const s = steps[i++];
      const atts = s.atts.filter(u => u.alive && !u.attacked && Hex.distance(u.c, u.r, s.e.c, s.e.r) === 1);
      if (atts.length) {
        const res = game.doAttack(atts, s.e, s.arty.filter(a => a.alive && !a.fired));
        if (res && res.advanceOffer) {
          const cand = pickAdvancer(side, res.advanceOffer);
          if (cand) game.doAdvance(cand);
        }
      }
      schedule(step, 60);
    })();
  }

  return { planTurn, executeTurn };
})();

</script>
<script>
'use strict';
/* ============================================================================
 * achv.js — 成就系统 + 历史战绩（第三十二轮）
 * ----------------------------------------------------------------------------
 * 纪律（conformance 有静态断言把关）：
 *   · 只读引擎：不调用 doMove / doAttack / artyFire / airStrike / grantBuff /
 *     attach / endPhase / _setPos 等任何改动型 API；
 *   · 不碰随机流：源码不出现 game.rng / Math.random；
 *   · 纯逻辑：不引用 document / window / THREE，可在 Node 里直接 eval 测试；
 *   · 只通过 game.on(...) 订阅事件 + 读 game.state/game.units/game.map 判定。
 *
 * 存储：ardennes44_achv（已解锁 + 计数）、ardennes44_history（最近 100 场 + 终身账）
 *       —— 与 ardennes44_save 解耦：那份存档与 OOB 版本绑定，成就/战绩必须独立。
 * 每局跟踪器挂在 game.state.achvTrack：随 serialize() 一起进存档，
 *       因此中途读档不会丢失"从未失守""连续断补"这类过程型进度。
 * ========================================================================== */
globalThis.Achv = (function () {
  const KEY_ACHV = 'ardennes44_achv';
  const KEY_HIST = 'ardennes44_history';
  const V = 1;
  const HIST_MAX = 100;

  const TIER_ORDER = { bronze: 0, silver: 1, gold: 2 };
  const HUBS = ['圣维特', '巴斯托涅', '豪法利兹'];
  const BASTOGNE = '巴斯托涅';
  const RIDGE_TOWNS = ['洛斯海姆', '马尔梅迪'];   // 埃尔森博恩岭：北翼两镇

  /* ---------------- 存储 ---------------- */
  function read(key) {
    try {
      const ls = globalThis.localStorage;
      if (!ls) return null;
      const s = ls.getItem(key);
      return s ? JSON.parse(s) : null;
    } catch (e) { return null; }
  }
  function write(key, val) {
    try {
      const ls = globalThis.localStorage;
      if (!ls) return false;
      ls.setItem(key, JSON.stringify(val));
      return true;
    } catch (e) { return false; }
  }
  function blankAchv() { return { v: V, unlocked: {}, counters: {} }; }
  function blankHist() {
    return {
      v: V, games: [],
      life: { games: 0, rounds: 0, exits: 0, killed: 0, wins: { DE: 0, US: 0 } },
    };
  }
  function stateAchv() { const a = read(KEY_ACHV); return a && a.v === V ? a : blankAchv(); }
  function stateHist() { const h = read(KEY_HIST); return h && h.v === V ? h : blankHist(); }

  /* ---------------- 本局跟踪器 ---------------- */
  function newTrack(meta) {
    return {
      meta: meta || { role: 'de', scenario: 'standard', noLimit: false, seed: null, side: 'DE' },
      townCtrl: null,        // 上次快照：城镇名 -> 控制方
      hubsDE: {},            // 曾被德军占领过的枢纽
      ridgeLost: {},         // 埃尔森伯恩两镇是否被德军占过
      round1Towns: [],       // 第 1 回合被德军占领的城镇
      usTownsRecaptured: {}, // campaign：第 13~16 回合被美军收复的枢纽
      deInPhase: [],         // 本阶段打出 DE 的单位 id（去重）
      maxDeInPhase: 0,
      airHits: {},           // 回合 -> { 目标key: true }（空袭命中）
      bastogneUnsupPhases: 0,// 巴斯托涅守军断补的阶段数
      bastogneHeldR8: false, // 第 8 回合开始时巴斯托涅仍在美军手中
      unsupEnemyMax: 0,      // 敌方单位最大连续断补阶段数
      unsupStreak: {},       // 单位 id -> 连续断补阶段数
      engrTownStreak: {},    // 工兵 id -> 城镇格连续驻守阶段数
      bridgeHold: {},        // 桥格 key -> 美军连续驻守阶段数
      buffsUsed: {},         // 本局用过的支援资产
      peiperWest: false,
      reconMax: 0,           // 侦察营单回合最大移动格数
      abnBastogneUnsup: 0,   // 空降兵在断补状态下守巴斯托涅的阶段数
      lastKm: false,         // 德军装甲是否推进到 c ≤ 12（塞勒方向）
      ended: false,
    };
  }
  function track(game, meta) {
    const st = game.state;
    if (!st.achvTrack || !st.achvTrack.meta) st.achvTrack = newTrack(meta || (st.achvTrack && st.achvTrack.meta));
    return st.achvTrack;
  }

  /* ---------------- 事件 → 跟踪器 ---------------- */
  function snapTowns(game, t) {
    const cur = {};
    for (const town of game.map.towns) cur[town.name] = town.ctrl;
    if (!t.townCtrl) { t.townCtrl = cur; return; }
    const round = game.state.round;
    for (const name of Object.keys(cur)) {
      const was = t.townCtrl[name], now = cur[name];
      if (!was || was === now) continue;
      if (now === 'DE') {
        if (HUBS.includes(name)) t.hubsDE[name] = round;
        if (RIDGE_TOWNS.includes(name)) t.ridgeLost[name] = round;
        if (round === 1 && was === 'US') t.round1Towns.push(name);
      } else if (now === 'US' && round >= 13 && round <= 16 && HUBS.includes(name)) {
        t.usTownsRecaptured[name] = round;
      }
    }
    t.townCtrl = cur;
  }

  // 阶段推进：断补连击、守桥/工兵驻守、北翼与巴斯托涅的态势快照
  function onPhase(game, t) {
    const st = game.state;
    const b = game.map.townMap[BASTOGNE];
    if (b && st.round === 8 && b.ctrl === 'US') t.bastogneHeldR8 = true;
    // 断补连击（按单位记；敌方取最大值 → 合围）
    for (const u of game.units) {
      if (!u.alive || u.exited) continue;
      const k = u.uid;
      if (u.supplied === false) {
        t.unsupStreak[k] = (t.unsupStreak[k] || 0) + 1;
        if (u.side !== st.phase && t.unsupStreak[k] > t.unsupEnemyMax) t.unsupEnemyMax = t.unsupStreak[k];
      } else {
        t.unsupStreak[k] = 0;
      }
    }
    // 巴斯托涅守军断补（城镇格或其邻格有断补的美军守军）
    if (b && b.ctrl === 'US') {
      const near = game.units.some(u => u.alive && !u.exited && u.side === 'US' && u.supplied === false
        && Hex.distance(u.c, u.r, b.c, b.r) <= 1);
      if (near) t.bastogneUnsupPhases++;
    }
    // 工兵驻守城镇 / 美军守桥
    for (const u of game.units) {
      if (!u.alive || u.exited) continue;
      const k = u.uid, hex = game.hexAt(u.c, u.r);
      if (!hex) continue;
      if (u.type === 'ENGR') t.engrTownStreak[k] = hex.town ? (t.engrTownStreak[k] || 0) + 1 : 0;
      if (u.side === 'US' && hex.bridge) {
        const bk = Hex.key(u.c, u.r);
        t.bridgeHold[bk] = (t.bridgeHold[bk] || 0) + 1;
      }
    }
    // 空降死守：空降兵团在断补状态下守巴斯托涅（城镇格或其邻格）
    if (b && b.ctrl === 'US') {
      const abnNear = game.units.some(u => u.alive && !u.exited && u.side === 'US' && u.type === 'ABN'
        && u.supplied === false && Hex.distance(u.c, u.r, b.c, b.r) <= 1);
      if (abnNear) t.abnBastogneUnsup++;
    }
    snapTowns(game, t);
  }

  function onCombat(game, t, ev) {
    const st = game.state;
    // 引擎真实载荷：emit('combat', { defUnit, attUnits, artyUnits, res })，其中 res 是 Combat.resolve 的
    // **返回对象**（结果串在 res.result、战列码在 res.key）。这里做一次归一化，
    // 同时也接受 res 直接是结果串（测试/未来重构用）——两种形状都吃得下。
    const raw = ev.res;
    const res = (raw && typeof raw === 'object') ? raw.result : raw;
    const rv = (raw && typeof raw === 'object') ? raw : {};
    const def = ev.defUnit, atts = ev.attUnits || [], artys = ev.artyUnits || [];
    const defHex = def && game.hexAt(def.c, def.r);
    // 空袭：只登记"本回合打过这个格"，供空地协同判定
    if (ev.air) {
      if (def) { t.airHits[st.round] = t.airHits[st.round] || {}; t.airHits[st.round][Hex.key(def.c, def.r)] = true; }
      return;
    }
    // 炮兵远程射击（无地面攻击方）
    if (ev.ranged && !atts.length) {
      if (res === 'DE') t._timeOnTarget = true;
      return;
    }
    const attHex = atts[0] && game.hexAt(atts[0].c, atts[0].r);
    const allArm = atts.length > 0 && atts.every(a => a.type === 'ARM');   // 与引擎 §战斗 的"装甲冲击"同口径
    const soft = def && !DATA.TYPES[def.type].antiArmor;
    // 以弱胜强：rv.key 是 Combat.resolve 带出的战列码（1:4…6:1）。
    // 用数值解析而非 ODDS_ORDER 下标——下标方向依赖数组顺序，是易错写法。
    if (res === 'DE' && rv.key) {
      const r = oddsRatio(rv.key);
      if (r != null && r <= 0.5) t._againstOdds = true;      // 1:2 或更差
    }
    if (res === 'DE' || res === 'AE') {
      for (const a of atts) if (!t.deInPhase.includes(a.uid)) t.deInPhase.push(a.uid);
      t.maxDeInPhase = Math.max(t.maxDeInPhase, t.deInPhase.length);
      if (t.deInPhase.length >= 3) t._threeInDay = true;
    }
    if (res === 'DE') {
      // 装甲楔子：纯装甲 + 开阔地 + 守方无任何反装甲火力（与引擎升档条件一致）
      if (allArm && soft && defHex && defHex.terrain === 'plain') t._panzerkeil = true;
      // 强渡：从非河格打河格守军
      if (defHex && defHex.river && attHex && !attHex.river) t._crossing = true;
      // 炮火准备：两个炮兵营同时支援一次地面攻击
      if (artys.length >= 2 && artys.every(a => a.type === 'ART')) t._artyTwo = true;
      // 铁拳：守方配属反坦克小组、遭纯装甲攻击、且守住了（未被歼灭）
      if (def && def.attach && def.attach.at && allArm && def.alive) t._panzerfaust = true;
      // 空地协同：本回合空袭过同一目标，且地面攻击将其击破
      if (def && t.airHits[st.round] && t.airHits[st.round][Hex.key(def.c, def.r)]) t._cabRank = true;
    }
  }

  function onBuff(game, t, ev) {
    const id = ev && ev.id;
    if (id) t.buffsUsed[id] = true;
  }

  function onMove(game, t, ev) {
    const u = ev && ev.unit;
    if (!u) return;
    // 侦察的价值：侦察营单回合移动 ≥8 格
    if (u.type === 'RECON' && ev.path && ev.path.length > t.reconMax) t.reconMax = ev.path.length;
    if (u.side !== 'DE') return;
    // 最后的几公里：德军装甲/摩托化推进到 c ≤ 12（塞勒方向）
    if (u.c <= 12 && (u.type === 'ARM' || u.type === 'MOT')) t.lastKm = true;
    // 派佩尔的驰骋：派佩尔装甲营推进到乌尔特河以西（RIVERS 是 {河名: [[c,r]…]}）
    if (/派佩尔/.test(u.name || '') && westOfOurthe(u.c, u.r)) t.peiperWest = true;
  }

  // 战列码 → 数值比值（'1:2' → 0.5；'6:1' → 6）；无法解析返回 null
  function oddsRatio(key) {
    const m = /^(\d+)\s*:\s*(\d+)$/.exec(key || '');
    return m ? (+m[1]) / (+m[2]) : null;
  }

  // 乌尔特河以西：同行 ±2 取该河最西列，单位在其以西即算过河
  function westOfOurthe(c, r) {
    const pts = (DATA.RIVERS && DATA.RIVERS.ourthe) || [];
    let minC = Infinity;
    for (const p of pts) if (Math.abs(p[1] - r) <= 2) minC = Math.min(minC, p[0]);
    return isFinite(minC) && c < minC;
  }

  /* ---------------- 判定表（键 = 成就 id） ---------------- */
  const CHECKS = {
    first_snow: (g, t) => g.state.over === true,
    long_winter: (g, t) => g.state.over === true && g.scenario.campaign && g.state.round >= g.scenario.rounds,
    two_commanders: (g, t) => g.state.over === true && t.meta.role === 'hotseat',
    observer: (g, t) => g.state.over === true && t.meta.role === 'watch',
    annihilation: (g, t) => g.state.over === true && !!t.meta.noLimit,
    wacht_am_rhein: (g) => g.state.victoryKey === 'DE_decisive' && !g.scenario.campaign,
    to_the_meuse: (g) => (g.state.exits || 0) >= 1,
    both_hubs: (g, t) => !!t.hubsDE['圣维特'] && !!t.hubsDE['巴斯托涅'],
    nuts: (g, t) => {
      const b = g.map.townMap[BASTOGNE];
      if (!b || b.ctrl !== 'US') return false;
      return t.bastogneHeldR8 && t.bastogneUnsupPhases >= 2;
    },
    shoulder_to_shoulder: (g, t) => g.state.over === true && g.state.victoryKey === 'US_decisive' && g.scenario.campaign,
    decisive_defense: (g) => g.state.over === true && g.state.victoryKey === 'US_decisive' && !g.scenario.campaign,
    panzerkeil: (g, t) => !!t._panzerkeil,
    crossing_our: (g, t) => !!t._crossing,
    panzerfaust: (g, t) => !!t._panzerfaust,
    artillery_prep: (g, t) => !!t._artyTwo,
    cab_rank: (g, t) => !!t._cabRank,
    kessel: (g, t) => t.unsupEnemyMax >= 3,
    engineers_hold: (g, t) => Object.values(t.engrTownStreak).some(v => v >= 3),
    peipers_ride: (g, t) => !!t.peiperWest,
    trois_ponts: (g, t) => Object.values(t.bridgeHold).some(v => v >= 3),
    herbstnebel: (g, t) => t.round1Towns.length >= 2,
    elsenborn_ridge: (g, t) => g.state.over === true && g.state.victoryKey === 'US_decisive'
      && !g.scenario.campaign && RIDGE_TOWNS.every(n => !t.ridgeLost[n]),
    christmas_counter: (g, t) => Object.keys(t.usTownsRecaptured).length >= 1,
    ribbon_rack: (g, t, ctx) => {
      const others = DATA.ACHIEVEMENTS.filter(a => a.id !== 'ribbon_rack');
      return others.every(a => ctx.unlocked[a.id] || CHECKS[a.id](g, t, ctx));
    },
    /* —— 阶段 C 长尾 —— */
    time_on_target: (g, t) => !!t._timeOnTarget,
    recon_value: (g, t) => t.reconMax >= 8,
    fuel_discipline: (g) => {
      const st = g.state;
      if (!(st.fuelDE > 0 && (st.exits || 0) >= 1)) return false;
      return (g.map.depots || []).every(d => !d.captured);       // 没靠缴获油库
    },
    against_odds: (g, t) => !!t._againstOdds,
    three_in_day: (g, t) => !!t._threeInDay,
    supply_wizard: (g, t) => ['at', 'med', 'fire', 'repl', 'fort'].every(k => t.buffsUsed[k]),
    airborne_hold: (g, t) => t.abnBastogneUnsup >= 3,
    pyrrhic_victory: (g) => {
      if (!g.state.over || g.state.winner !== 'US') return false;
      try { return g._lossPct('US') >= 0.4; } catch (e) { return false; }
    },
    last_kilometers: (g, t) => !!t.lastKm && !!g.scenario.campaign,
    // 以下四条依赖终身账：life 在 Achv.finish 里 pushHistory 之后才含本局，故由 finish 的第二轮求值解锁
    ten_offensives: () => stateHist().life.games >= 10,
    veteran_bulge: () => stateHist().life.games >= 25,
    a_thousand: () => stateHist().life.killed >= 1000,
