<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>阿登1944 · 突出部战役兵棋推演</title>
<style>
  :root {
    --de-color: #8a9284;
    --us-color: #6fa3cf;
    --bg-panel: rgba(12, 16, 20, 0.86);
    --edge: rgba(255, 255, 255, 0.1);
    --gold: #d8b74a;
    /* 第二十轮：制图风格 token（发丝线 / 黄铜 / 等宽制表数字 / 窄体标题） */
    --hair: rgba(255, 255, 255, 0.09);
    --brass: #c8a94a;
    --rule: rgba(216, 183, 74, 0.30);
    --mono: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace;
    --disp: Bahnschrift, "DIN Alternate", "Arial Narrow", "Microsoft YaHei", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e12;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #e8e4d8;
    /* 手机端: 关掉橡皮筋回弹与双击高亮; -webkit-text-size-adjust 防止 iOS 横屏自动放大字号 */
    overscroll-behavior: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  /* 画布接管全部手势: touch-action:none 让浏览器不再对这块区域做滚动/双击缩放,
     双指捏合与拖动才不会被引擎以外的行为抢走(见 render.js 的多指手势实现) */
  #scene { position: absolute; inset: 0; touch-action: none; }
  #scene canvas { display: block; touch-action: none; }

  /* ---------- 顶栏 ---------- */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; min-height: 54px;
    background: var(--bg-panel); border-bottom: 1px solid var(--edge);
    display: flex; align-items: center; gap: 10px 14px; padding: 8px 16px; z-index: 10;
    font-size: 13px; flex-wrap: wrap;   /* 24z2: 宽屏单行, 窗口窄时按钮组自动落第二行 */
  }
  #topbar .title { font-weight: bold; font-size: 16px; letter-spacing: 2px; color: var(--gold); }
  #topbar .sep { width: 1px; height: 26px; background: var(--edge); }
  #topbar .stat { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  #topbar .label { color: #9aa0a6; }
  #phaseTag { padding: 2px 10px; border-radius: 3px; font-weight: bold; }
  #phaseTag.DE { background: #4a4f45; color: #cfd6c8; }
  #phaseTag.US { background: #2f4a63; color: #cfe3f5; }
  #fuelBar { width: 90px; height: 8px; background: #222; border-radius: 4px; overflow: hidden; }
  #fuelFill { height: 100%; background: linear-gradient(90deg, #b0653a, #d8b74a); }
  #topbar .grow { flex: 1; }
  /* 第二十九轮: 顶栏拆成「状态组 + 按钮组」两个容器。
     桌面端样式与拆分前完全一致; 窄屏下按钮组整体折叠成菜单、状态组横向滚动(见文末 @media)。 */
  #topStats, #topBtns { display: flex; align-items: center; gap: 12px; }
  #topStats { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  #topStats::-webkit-scrollbar { height: 0; }
  
  #topBtns { flex-wrap: wrap; row-gap: 6px; }
  #topBtns { gap: 6px; }
  #btnMenu { display: none; }
  /* 相机控制条: 左下角常驻(放大/缩小/全图), 触屏没有滚轮时用它兜底 */
  #camCtl { position: absolute; left: 10px; bottom: 52px; z-index: 10; display: flex; gap: 6px; }
  #camCtl button { width: 38px; height: 38px; padding: 0; font-size: 17px; line-height: 1;
    border-radius: 5px; background: rgba(16, 21, 26, 0.88); }
  button {
    background: #2a3138; color: #e8e4d8; border: 1px solid var(--edge);
    padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px;
    font-family: inherit; transition: background 0.15s;
  }
  button:hover { background: #3a434c; }
  button.primary { background: #7a5c22; border-color: #a5822f; }
  button.primary:hover { background: #96742e; }
  button.danger { background: #6b2f28; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.active { background: #55612e; border-color: #7d9140; }
  /* 音效开关：关闭态明确变暗（不靠颜色单独传达状态，文字同步改为「音效 关」） */
  #btnSfx.off, #btnDosPop.off { opacity: 0.5; }
  /* —— 24z 顶栏重构：分组分隔 / 图标前缀 / 主次分级 —— */
  #topBtns { gap: 6px; }
  .tb-sep { width: 1px; height: 22px; background: var(--edge); margin: 0 7px; flex: none; }
  #topBtns button {
    padding: 6px 12px; border-radius: 6px; white-space: nowrap; font-size: 12.5px;
    background: linear-gradient(180deg, #2e353d, #232a31); border: 1px solid var(--edge);
  }
  #topBtns button:hover { background: #3d4650; border-color: #6a7683; }
  #btnEnd {
    background: linear-gradient(180deg, #8a6a24, #6e521c); border-color: #c9a227;
    font-weight: 700; letter-spacing: 1px; padding: 6px 16px;
  }
  #btnEnd::before { content: '\25B5\00A0'; font-size: 10px; }
  #btnEnd:hover { background: #a3812e; border-color: #e6c85c; }
  #btnOOB::before { content: '\25A4\00A0'; }
  #btnDossiers::before { content: '\25A3\00A0'; }
  #btnAchv::before { content: '\2726\00A0'; color: #e6c85c; }
  #btnRules::before { content: '?\00A0'; color: #9aa39a; }
  #btnSfx::before, #btnDosPop::before { content: '\266A\00A0'; }
  #btnAISpeed::before { content: '\23F1\00A0'; }
  #btnAIde, #btnAIus { min-width: 68px; text-align: center; }
  #btnRestart { border-color: #6e4038; }
  #btnRestart:hover { background: #4a2b26; border-color: #9a5a4e; }
  #btnUndo::before { content: '\21B6\00A0'; }
  #btnUndo:disabled { opacity: 0.4; cursor: default; }
  #btnAI { border-color: #55612e; }
  #btnAI::before { content: '\2694\00A0'; color: #b8c4b0; }
  #btnToggles::before { content: '\2699\00A0'; }
  #btnPause { min-width: 74px; text-align: center; }
  /* 25a AI 指挥面板（复用 ach-box 军事风） */
  .aim-sec { margin: 14px 0; }
  .aim-row { display: flex; align-items: center; gap: 14px; padding: 11px 4px; border-bottom: 1px solid var(--hair); }
  .aim-row:last-child { border-bottom: none; }
  .aim-t { font-family: var(--disp); font-size: 14.5px; letter-spacing: 1px; color: #f0ead6; }
  .aim-d { font-size: 11.5px; color: #8f968f; margin-top: 3px; line-height: 1.5; }
  .aim-row > div:first-child { flex: 1; }
  .aim-sw { min-width: 74px; min-height: 34px; border-radius: 6px; font-weight: 700; }
  .aim-sw.on { background: #55612e; border-color: #7d9140; color: #e8e4d8; }
  .aim-speeds { display: flex; gap: 10px; margin-top: 9px; flex-wrap: wrap; }
  .aim-pc { flex: 1; min-width: 140px; text-align: left; padding: 10px 12px; border-radius: 6px;
    background: #1c2127; border: 1px solid var(--hair); cursor: pointer; color: #cfd3c8; }
  .aim-pc b { display: block; font-size: 13px; letter-spacing: 1px; margin-bottom: 3px; }
  .aim-pc span { font-size: 11px; color: #8f968f; line-height: 1.4; }
  .aim-pc.on { border-color: #c9a227; background: rgba(230, 200, 92, 0.07); }
  .aim-pc.on b { color: #e6c85c; }
  /* 25a 开关浮层 */
  #swPop {
    position: fixed; z-index: 45; width: 220px; padding: 10px 12px;
    background: rgba(14, 17, 21, 0.97); border: 1px solid var(--edge); border-radius: 8px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5);
  }
  .sw-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  .sw-k { flex: 1; font-size: 12.5px; color: #cfd3c8; letter-spacing: 1px; }
  .sw-btn { min-width: 64px; text-align: center; min-height: 30px; }
  .sw-btn.off { opacity: 0.5; }
  /* 启动状态/失败面板(原版35轮移植) */
  #bootStatus { position: absolute; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(5, 7, 10, 0.88); }
  #bootStatus[hidden] { display: none; }
  #bootStatus .bs-box { min-width: 320px; max-width: 88%; padding: 22px 26px; text-align: center; background: #14181d; border: 1px solid var(--rule); border-radius: 3px; }
  #bootStatus .bs-kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 2.6px; color: #78808a; }
  #bootStatus .bs-msg { margin-top: 10px; font-family: var(--disp); font-size: 17px; letter-spacing: 1px; color: #e8e4d8; }
  #bootStatus .bs-hint { margin-top: 8px; font-size: 12.5px; line-height: 1.8; color: #9aa0a6; }
  #bootStatus .bs-foot { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  #bootStatus.error .bs-msg { color: #e8907a; }
  #bootStatus .spinner { display: inline-block; width: 13px; height: 13px; margin-right: 8px; vertical-align: -2px; border: 2px solid rgba(216,183,74,.28); border-top-color: var(--brass); border-radius: 50%; animation: bsSpin .9s linear infinite; }
  @keyframes bsSpin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #bootStatus .spinner { animation: none; } }

  /* ---------- 左侧单位面板 ---------- */
  #unitPanel {
    position: absolute; left: 12px; top: 66px; width: 250px;
    background: var(--bg-panel); border: 1px solid var(--edge); border-radius: 6px;
    padding: 12px; z-index: 10; display: none;
  }
  #unitPanel h3 { font-size: 15px; margin-bottom: 2px; }
  #unitPanel .type-tag { font-size: 11px; color: #9aa0a6; margin-bottom: 8px; }
  #unitPanel .stats { display: flex; gap: 10px; margin: 8px 0; }
  #unitPanel .stat-box { flex: 1; text-align: center; background: rgba(255,255,255,0.05);
    border-radius: 4px; padding: 6px 0; }
  #unitPanel .stat-box .v { font-size: 20px; font-weight: bold; color: var(--gold); }
  #unitPanel .stat-box .k { font-size: 11px; color: #9aa0a6; }
  #unitPanel .orgwrap { margin: 8px 0; }
  #unitPanel .orgbar { height: 10px; background: #222; border-radius: 5px; overflow: hidden; }
  #unitPanel .orgfill { height: 100%; transition: width 0.3s; }
  #unitPanel .state-line { font-size: 12px; margin: 4px 0; }
  #unitPanel .btns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  #unitPanel .btns button { flex: 1; padding: 6px 4px; font-size: 12px; }

  /* ---------- 战报 ---------- */
  #logPanel {
    position: absolute; right: 12px; top: 66px; width: 330px; bottom: 52px;
    background: var(--bg-panel); border: 1px solid var(--edge); border-radius: 6px;
    z-index: 10; display: flex; flex-direction: column;
  }
  #logPanel .head { display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 12px; border: 0; border-bottom: 1px solid var(--edge); border-radius: 5px 5px 0 0;
    background: transparent; text-align: left; font-family: inherit; font-weight: bold;
    font-size: 13px; color: var(--gold); letter-spacing: 2px; cursor: pointer; }
  #logPanel .head:hover { background: rgba(255, 255, 255, 0.05); }
  #logPanel .head .ttl { flex: 1; }
  #logPanel .head .chev { font-size: 12px; letter-spacing: 0; transition: transform 0.18s; }
  #logPanel.collapsed .head .chev { transform: rotate(-90deg); }
  #logPanel .head .unread { font-size: 11px; letter-spacing: 0; font-weight: bold; color: #10161c;
    background: var(--gold); border-radius: 9px; padding: 0 6px; line-height: 16px; }
  #logPanel.collapsed { bottom: auto; }
  #logPanel.collapsed #logList { display: none; }
  #logList { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 12px; line-height: 1.7; }
  #logList .de { color: #b8c4b0; }
  #logList .us { color: #a8c8e8; }
  #logList .sys { color: #d8b74a; font-weight: bold; }
  #logList .warn { color: #e8907a; }
  #logList .hist { color: #c9b98a; font-style: italic; border-left: 2px solid #8a7a50; padding-left: 8px; margin: 4px 0; }
  #logList::-webkit-scrollbar { width: 6px; }
  #logList::-webkit-scrollbar-thumb { background: #3a434c; border-radius: 3px; }

  /* ---------- 底部提示 ---------- */
  #hintbar {
    position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: var(--bg-panel); border-top: 1px solid var(--edge);
    display: flex; align-items: center; padding: 0 16px; gap: 20px;
    font-size: 12px; color: #9aa0a6; z-index: 10;
  }
  #hintbar b { color: #e8e4d8; }
  /* 提示语两套共存, 由 @media 按指针类型切换(触屏不该告诉用户去按 WASD) */
  .hint-touch { display: none; }

  /* ---------- 悬浮提示 ---------- */
  #tooltip {
    position: absolute; pointer-events: none; z-index: 20;
    background: rgba(8, 10, 14, 0.92); border: 1px solid var(--edge); border-radius: 4px;
    padding: 8px 10px; font-size: 12px; display: none; max-width: 260px; line-height: 1.6;
  }

  /* ---------- 战力比 / 结算弹窗（第二十轮：制图风格，直角 + 发丝线 + 等宽数字） ---------- */
  #oddsPopup {
    position: absolute; bottom: 56px; left: 50%; transform: translateX(-50%);
    background: #10151a; border: 1px solid var(--hair); border-top: 2px solid var(--brass); border-radius: 2px;
    padding: 13px 20px; z-index: 15; display: none; text-align: center; min-width: 380px;
  }
  #oddsPopup .odds-big { font-family: var(--disp); font-size: 24px; font-weight: 700;
    letter-spacing: 2px; color: var(--brass); margin: 5px 0; }
  #oddsPopup .dice { font-family: var(--mono); font-size: 17px; margin: 7px 0 5px; letter-spacing: 2px; color: #e8e4d8; }
  #oddsPopup .detail { font-size: 12px; line-height: 1.6; color: #939aa2; margin-bottom: 7px; }
  #oddsPopup .btns { display: flex; gap: 10px; justify-content: center; margin-top: 9px; }
  #oddsPopup .btns button { border-radius: 2px; letter-spacing: 2px; }
  /* 战损拆分：攻/守分列（组织度实扣 + 歼灭建制数） */
  #oddsPopup .loss-wrap { display: flex; gap: 10px; justify-content: center; margin: 7px 0 2px; }
  #oddsPopup .loss { display: flex; flex-direction: column; align-items: center; gap: 1px;
    min-width: 120px; padding: 6px 12px; border-radius: 2px;
    background: #171c22; border: 1px solid var(--hair); }
  #oddsPopup .loss .loss-k { font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.4px; color: #78808a; }
  #oddsPopup .loss .loss-v { font-family: var(--mono); font-size: 15px; font-weight: 700;
    letter-spacing: .3px; font-variant-numeric: tabular-nums; }
  #oddsPopup .loss .loss-d { font-size: 11px; color: #8f959b; }
  #oddsPopup .loss.atk { border-left: 3px solid rgba(232,160,106,.55); }
  #oddsPopup .loss.def { border-left: 3px solid rgba(127,176,216,.55); }
  #oddsPopup .loss.atk .loss-v { color: #e8a06a; }
  #oddsPopup .loss.def .loss-v { color: #7fb0d8; }

  /* ---------- 回合横幅 ---------- */
  #banner {
    position: absolute; top: 38%; left: 0; right: 0; text-align: center; z-index: 30;
    pointer-events: none; opacity: 0; transition: opacity 0.4s;
  }
  #banner .big { font-size: 42px; font-weight: bold; letter-spacing: 8px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
  #banner .sub { font-size: 16px; color: #cfc9b8; letter-spacing: 4px; margin-top: 6px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.8); }

  /* ---------- 模态框 ---------- */
  #modal {
    position: absolute; inset: 0; background: rgba(5, 7, 10, 0.78); z-index: 40;
    display: none; align-items: center; justify-content: center;
  }
  #modal .box {
    background: #14181d; border: 1px solid var(--edge); border-radius: 10px;
    padding: 28px 34px; max-width: 640px; width: 92%; max-height: 86vh; overflow-y: auto;
  }
  #modal h1 { font-size: 24px; color: var(--gold); letter-spacing: 3px; margin-bottom: 4px; }
  #modal h2 { font-size: 16px; color: #cfc9b8; margin: 14px 0 8px; }
  /* ========== 开局界面：制图 · 作战命令风格（去 AI 味：直角 / 发丝线 / 编号 / 制表数字） ========== */
  #modal .box.start-box { max-width: 660px; padding: 0; border-radius: 3px; }
  #modal .sd-head { position: relative; padding: 22px 30px 16px; border-bottom: 1px solid var(--hair); }
  #modal .sd-kicker { font-family: var(--mono); font-size: 10px; letter-spacing: 2.6px; color: #78808a; text-transform: uppercase; }
  #modal .sd-head h1 { font-family: var(--disp); font-size: 31px; font-weight: 700; letter-spacing: 7px; color: #eee9dc; margin: 7px 0 5px; }
  #modal .sd-head h1 span { color: var(--brass); letter-spacing: 3px; }
  #modal .sd-sub { font-size: 12.5px; letter-spacing: .4px; color: #8f969e; }
  #modal .sd-stamp {
    position: absolute; right: 30px; top: 24px; padding: 4px 8px; border: 1px solid var(--rule);
    font-family: var(--mono); font-size: 9.5px; line-height: 1.75; letter-spacing: 1.3px;
    color: var(--brass); text-align: center;
  }
  #modal .sd-h { display: flex; align-items: center; gap: 9px; margin: 18px 30px 9px;
    font-size: 12.5px; font-weight: 700; letter-spacing: 1.6px; color: #cfc9b8; }
  #modal .sd-h::before { content: ''; flex: none; width: 7px; height: 7px; background: var(--brass); }
  #modal .sd-h::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
  #modal .sd-h .sd-en { font-family: var(--mono); font-size: 9.5px; font-weight: 400; letter-spacing: 1.8px; color: #6f767d; }
  /* 剧本：编号 + 主副标题的行式清单（左侧 3px 选中条，不做圆角卡片与发光） */
  #modal .scen-list { margin: 0 30px; }
  #modal .scen { display: flex; gap: 13px; align-items: flex-start; margin: 0; padding: 10px 12px 11px 11px;
    border: 0; border-left: 3px solid transparent; border-bottom: 1px solid var(--hair); border-radius: 0;
    cursor: pointer; transition: background .12s, border-left-color .12s; }
  #modal .scen:first-child { border-top: 1px solid var(--hair); }
  #modal .scen:hover { background: rgba(255,255,255,.03); border-left-color: rgba(255,255,255,.2); }
  #modal .scen.sel { background: rgba(216,183,74,.075); border-left-color: var(--brass); }
  #modal .sc-idx { flex: none; padding-top: 3px; font-family: var(--mono); font-size: 11px; letter-spacing: 1px; color: #6b737b; }
  #modal .scen.sel .sc-idx { color: var(--brass); }
  #modal .sc-main { flex: 1; min-width: 0; }
  #modal .scen .n { font-size: 14.5px; font-weight: 700; letter-spacing: .6px; color: #e8e4d8; }
  #modal .scen .s { margin: 3px 0 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .6px; color: var(--brass); }
  #modal .scen .d { font-size: 12px; line-height: 1.7; color: #8f969e; }
  #modal .sc-tick { flex: none; padding-top: 4px; font-family: var(--mono); font-size: 9.5px; letter-spacing: 1.4px;
      .sc-origin { display:inline-block; margin-left:6px; padding:0 5px; font-size:10px; color:#d8c48a; border:1px solid #8a7a4a; border-radius:3px; vertical-align:2px; }
    color: var(--brass); visibility: hidden; }
  #modal .scen.sel .sc-tick { visibility: visible; }
  /* 角色：2×2 命令块，代号方章选中后反白 */
  #modal .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 30px; }
  #modal .side-btn { display: flex; align-items: center; gap: 9px; padding: 9px 11px; text-align: left;
    background: #1a1f25; border: 1px solid var(--hair); border-left: 3px solid rgba(255,255,255,.12);
    border-radius: 2px; font-size: 13px; color: #cfc9b8;
    transition: background .12s, border-color .12s; }
  #modal .side-btn:hover { background: #232a31; border-left-color: rgba(255,255,255,.3); }
  #modal .side-btn.sel { background: rgba(216,183,74,.10); border-color: rgba(216,183,74,.34);
    border-left-color: var(--brass); color: #f2ecd8; }
  #modal .sb-code { flex: none; width: 18px; height: 18px; line-height: 16px; text-align: center;
    font-family: var(--mono); font-size: 10px; color: #7c848c; border: 1px solid var(--hair); border-radius: 1px; }
  #modal .side-btn.sel .sb-code { background: var(--brass); border-color: var(--brass); color: #12161b; font-weight: 700; }
  #modal .sb-t { display: block; font-weight: 700; letter-spacing: .5px; }
  #modal .sb-d { display: block; margin-top: 2px; font-size: 11px; font-weight: 400; letter-spacing: .3px; color: #868d95; }
  #modal .side-btn.sel .sb-d { color: #bdb098; }
  /* 当前选择：命令摘要条 */
  #modal .sel-hint { display: flex; align-items: center; gap: 9px; margin: 16px 30px 0; padding: 8px 11px;

  /* ==================== 手机端适配（2026-10 第二十九轮） ====================
   * 触发: 视口宽度 ≤ 860px, 或 触屏粗指针 且 宽度 ≤ 1100px(横屏平板)。
   * 处理四件事:
   *   1) 顶栏换行 —— 第一行「标题·当前阶段·☰」, 第二行状态组横向滚动, 按钮全部收进下拉菜单;
   *   2) 面板改贴边 —— 单位面板/战报从左/右上浮窗改为底部卡片, 不再整块压住棋盘;
   *   3) 点击目标放大 —— 按钮最小 42px 高(指尖可靠命中), 松开菜单/输入等交互面积同步加大;
   *   4) 棋盘手势 —— 见 render.js: 单指拖动平移、双指捏合缩放、轻点(抖动 ≤14px)才算选中。
   * 注意: 我没有禁用 user-scalable。画布用 touch-action:none 自己吃掉缩放手势,
   *       面板里的小字仍允许系统缩放, 保留无障碍能力。
   * ======================================================================== */
  @media (max-width: 860px), (pointer: coarse) and (max-width: 1100px) {
    /* iPhone 等带 Home 指示条的机型: 底部预留安全区, 免得按钮压在系统手势条下面 */
    :root { --sab: env(safe-area-inset-bottom, 0px); }
    #topbar { height: auto; flex-wrap: wrap; gap: 8px; row-gap: 6px; padding: 7px 10px; }
    #topbar .title { font-size: 13px; letter-spacing: 1px; }
    #topbar .sep { display: none; }
    #topStats { order: 3; flex: 1 1 100%; gap: 12px; overflow-x: auto; overflow-y: hidden;
      padding-bottom: 3px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #topStats::-webkit-scrollbar { height: 0; }
    #phaseTag { font-size: 12px; padding: 2px 8px; }
    #btnMenu { display: inline-flex; align-items: center; justify-content: center;
      min-width: 42px; min-height: 38px; font-size: 18px; }
    #topBtns { position: absolute; top: 100%; left: 0; right: 0; z-index: 11; display: none;
      flex-direction: column; gap: 8px; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(9, 12, 16, 0.97); border-bottom: 1px solid var(--edge);
      /* 横屏手机可视高度只有 ~390px, 7 个按钮会顶出屏幕: 限高并允许菜单内部滚动 */
      max-height: 62vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    #topbar.open #topBtns { display: flex; }
    #topBtns button { width: 100%; min-height: 44px; font-size: 14px; letter-spacing: 1px; }
    /* 底部卡片式面板: 都抬到相机控制条(bottom:46px, 高 46px)之上, 三者在竖向不打架;
       单位面板与战报互斥(选中单位时 body.unit-open 隐藏战报), 所以可以共用同一条底边 */
    #unitPanel { left: 8px; right: 8px; top: auto; bottom: calc(100px + var(--sab)); width: auto;
      max-height: 44vh; overflow-y: auto; }
    #logPanel { left: 8px; right: 8px; top: auto; bottom: calc(100px + var(--sab)); width: auto; max-height: 30vh; }
    #logPanel.collapsed { bottom: calc(100px + var(--sab)); }
    body.unit-open #logPanel { display: none; }
    #logList { font-size: 12.5px; line-height: 1.6; }
    #hintbar { height: calc(36px + var(--sab)); padding: 0 10px; padding-bottom: var(--sab); gap: 10px;
      font-size: 11px; overflow-x: auto; white-space: nowrap; }
    #hintbar #legend { gap: 6px; font-size: 10.5px; }
    .hint-kb { display: none; }
    .hint-touch { display: inline; }
    /* 战力比弹窗: 从「居中 380px 宽」改为「贴底通栏」, 免得两列损失拆分被挤出屏幕 */
    /* 战力比弹窗: 从「居中 380px 宽」改为「贴底通栏」, 免得两列战损拆分被挤出屏幕;
       它在 z-index 上高于底部面板(15 > 10), 弹出时暂压住战报/单位面板, 按钮落在拇指区 */
    #oddsPopup { left: 8px; right: 8px; bottom: calc(52px + var(--sab)); transform: none; min-width: 0;
      padding: 11px 12px; }
    #oddsPopup .odds-big { font-size: 20px; }
    #oddsPopup .loss-wrap { flex-wrap: wrap; }
    #oddsPopup .loss { min-width: 104px; }
    #oddsPopup .btns button { flex: 1; min-height: 44px; font-size: 14px; }
    #tooltip { max-width: 62vw; font-size: 12px; }
    #camCtl { left: 8px; bottom: calc(46px + var(--sab)); }
    #camCtl button { width: 46px; height: 46px; font-size: 19px; }
    #banner .big { font-size: 28px; letter-spacing: 4px; }
    #banner .sub { font-size: 13px; letter-spacing: 2px; }
    #modal .box { width: 95%; max-height: 88vh; padding: 18px 16px; }
    #modal .tabs button { padding: 7px 12px; font-size: 12px; }
  }
/* ========== 成就与战绩（第三十二轮）==========
     风格：像素点阵图标 + 制图/黄铜 token，与算子面、图例同一套视觉语言；
     图标一律 canvas 逐像素绘制（image-rendering: pixelated），零外部图片。 */
  #achvToast { position: absolute; top: 66px; right: 16px; z-index: 45; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  .ach-card {
    pointer-events: auto; display: flex; gap: 12px; align-items: flex-start; width: 320px;
    background: linear-gradient(180deg, #191d22, #12161a); border: 1px solid var(--rule);
    border-left: 3px solid var(--brass); border-radius: 3px; padding: 12px 14px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5); opacity: 0; transform: translateX(24px);
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  .ach-card.in { opacity: 1; transform: translateX(0); }
  .ach-card.gold { border-left-color: #e6c85c; box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(230, 200, 92, 0.18); }
  .ach-card canvas { width: 48px; height: 48px; image-rendering: pixelated; flex: none; }

  <div id="bootStatus" hidden>

  <!-- 3D 引擎加载(原版35/36轮移植): 本地 vendor/three.min.js 经典脚本优先(file:// 双击可用),
       缺失时回退 3 条 CDN; 失败由 #bootStatus 明说并可重试。单文件版由 build.js 把
       本标签替换为 gzip+base64 内联 + DecompressionStream 解压(断网可玩)。 -->
  <script src="vendor/three.min.js"></script>
  <script>
    (function () {
      if (window.THREE) { window.__threeHow = '本地 vendor/three.min.js'; window.dispatchEvent(new Event('three-ready')); return; }
      /* 单文件版(build.js): #threeGz 数据块在,内联 loader 负责解压与回退,本段立即退出。
         否则会在异步解压完成前误判"THREE 不存在"抢先走 CDN,数秒后派发 three-failed,
         把已经成功的启动状态覆盖成失败遮罩(2026-10-25 冒烟发现)。 */
      if (document.getElementById('threeGz')) return;
      const CDN_LIST = [
        'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js',
        'https://registry.npmmirror.com/three/0.160.0/files/build/three.module.min.js',
        'https://lib.baomitu.com/three.js/0.160.0/three.module.min.js',
      ];
      const bootMsg = (msg, isError, hint) => {
        const el = document.getElementById('bootStatus'); if (!el) return;
        el.hidden = !msg; if (!msg) return;
        el.classList.toggle('error', !!isError);
        const m = document.getElementById('bsMsg'), h = document.getElementById('bsHint');
        if (m) m.innerHTML = (isError ? '' : '<span class="spinner"></span>') + msg;
        if (h) h.textContent = hint || '';
      };
      const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
      (async () => {
        bootMsg('正在加载 3D 引擎…', false, '本地 vendor/three.min.js 不可用，正在尝试备用线路');
        for (let i = 0; i < CDN_LIST.length; i++) {
          try {
            const mod = await withTimeout(import(CDN_LIST[i]), 6000);
            if (mod && mod.Scene) { window.THREE = mod; window.__threeHow = 'CDN ' + CDN_LIST[i].split('/')[2]; window.dispatchEvent(new Event('three-ready')); return; }
          } catch (e) { console.warn('[boot] CDN 失败', CDN_LIST[i], e && e.message); }
        }
        window.__threeFailed = '本地 vendor/three.min.js 未加载成功，且 ' + CDN_LIST.length + ' 条备用线路都失败';
        window.dispatchEvent(new Event('three-failed'));
      })();
    })();
  </script>
